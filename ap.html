<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Tọa Độ GPS Theo Tab Ấp & Đồng Bộ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #f4f6f9; font-size: 14px; }
    .ap-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); padding: 12px; margin-bottom: 10px; border-left: 4px solid #0d6efd; }
    .ap-card.has-gps { border-left-color: #198754; background-color: #f9fffb; }
    .ap-card.no-gps { border-left-color: #dc3545; background-color: #fff8f8; }
    #mapPicker { height: 350px; width: 100%; border-radius: 8px; }
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; left: 20px; }
    #toast-container .toast { width: 100%; max-width: 100%; }
    .btn, .form-select, .form-control { min-height: 38px; }
  </style>
</head>
<body>

  <div class="container py-3 px-2">
    <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-2 rounded shadow-sm flex-wrap gap-2">
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-dark btn-sm me-2">⬅️ Danh sách</a>
        <h5 class="mb-0 fw-bold text-primary">🏡 Quản Lý Ấp & Đồng Bộ</h5>
      </div>
      <div class="d-flex gap-1 flex-wrap">
        <button class="btn btn-warning btn-sm fw-bold text-dark" data-bs-toggle="modal" data-bs-target="#syncModal">🔄 Trung Tâm Đồng Bộ</button>
        <a href="map.html" class="btn btn-danger btn-sm fw-bold">🗺️ Bản đồ</a>
      </div>
    </div>

    <!-- KHUNG BỘ LỌC -->
    <div class="card p-3 mb-3 bg-white shadow-sm">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label fw-bold small mb-1">Chọn Tab Dữ Liệu:</label>
          <select id="selectTab" class="form-select form-select-sm fw-bold text-primary" onchange="renderApList()">
            <option value="ap_new">Tab: ap_new (3 cấp địa danh)</option>
            <option value="ap_old">Tab: ap_old (4 cấp địa danh)</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small mb-1">Tìm kiếm ấp/xã:</label>
          <input type="text" id="searchApKeyword" class="form-control form-control-sm" placeholder="Nhập tên ấp, xã..." oninput="renderApList()">
        </div>
      </div>
    </div>

    <div id="apCardContainer">
      <div class="text-center py-5 text-muted">Đang tải dữ liệu...</div>
    </div>
  </div>

  <!-- MODAL TRUNG TÂM ĐỒNG BỘ -->
  <div class="modal fade" id="syncModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title fw-bold">🔄 Trung Tâm Đồng Bộ Dữ Liệu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3 p-2 bg-light rounded border">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="overwriteGpsCheckbox">
              <label class="form-check-label fw-bold small text-danger" for="overwriteGpsCheckbox">
                ⚡ Gán đè dữ liệu GPS mới (Uncheck thì giữ lại GPS khách đã có)
              </label>
            </div>
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-warning fw-bold btn-sm py-2 text-dark" onclick="executeSyncAddressOnly()">🏡 Đồng Bộ Địa Chỉ & Phân Loại Ấp</button>
            <button class="btn btn-success fw-bold btn-sm py-2" onclick="executeAssignGps()">📍 Gán Ngược GPS Từ Tab Ấp Vào Khách</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL CHỌN GPS -->
  <div class="modal fade" id="gpsPickerModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="modalTitle">📍 Cập Nhật Tọa Độ GPS Ấp</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="input-group input-group-sm mb-2">
            <input type="text" id="modalGpsInput" class="form-control font-monospace" placeholder="Ví dụ: 10.032145, 105.781234">
            <button class="btn btn-success fw-bold" type="button" onclick="saveGpsFromModal()">💾 Lưu</button>
          </div>
          <div id="mapPicker"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwUE4uo5kihhrficlHTWtTeUDNy0n-vo49osANuoD17KzkueUzABRxUVgKzIwza-AW9/exec"; 
    let allApData = { ap_new: [], ap_old: [] };
    let currentEditingRow = null; let currentEditingTab = null;
    let mapPickerObj = null; let pickerMarker = null;

    window.onload = function() { loadApData(); };

    async function loadApData() {
      const res = await fetch(`${API_URL}?action=getApData`);
      const json = await res.json();
      if(json.success) {
        allApData.ap_new = json.ap_new || [];
        allApData.ap_old = json.ap_old || [];
        renderApList();
      }
    }

    function renderApList() {
      const tabName = document.getElementById("selectTab").value;
      const keyword = document.getElementById("searchApKeyword").value.toLowerCase();
      const container = document.getElementById("apCardContainer");
      let rawList = allApData[tabName] || [];

      let filtered = rawList.filter(item => {
        const fullStr = `${item.ap || ''} ${item.xaphuong || ''} ${item.tinhtp || ''}`.toLowerCase();
        return !keyword || fullStr.includes(keyword);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Không tìm thấy kết quả.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const hasGps = item.gps && item.gps.includes(',');
        return `
          <div class="ap-card ${hasGps ? 'has-gps' : 'no-gps'}">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <div><b>🏡 ${item.ap}</b> - ${item.xaphuong}</div>
              <button class="btn btn-sm btn-primary fw-bold" onclick="openGpsModal('${tabName}', ${item.rowIndex}, '${item.ap}', '${item.gps || ''}')">
                ${hasGps ? '✏️ Sửa GPS' : '📍 Thêm GPS'}
              </button>
            </div>
            <div class="small font-monospace text-dark bg-light p-1 rounded">GPS: ${item.gps || 'Chưa có'}</div>
          </div>
        `;
      }).join('');
    }

    async function executeSyncAddressOnly() {
      showToast("Đang phân loại ấp...", "primary");
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "syncAddressToApTabs" }) });
      const json = await res.json();
      showToast(json.message); loadApData();
    }

    async function executeAssignGps() {
      const overwrite = document.getElementById("overwriteGpsCheckbox").checked;
      showToast("Đang gán ngược GPS...", "primary");
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "assignGpsFromApTabs", overwrite: overwrite }) });
      const json = await res.json();
      showToast(json.message);
    }

    function openGpsModal(tabName, rowIndex, apName, currentGps) {
      currentEditingRow = rowIndex; currentEditingTab = tabName;
      document.getElementById("modalGpsInput").value = currentGps;
      new bootstrap.Modal(document.getElementById('gpsPickerModal')).show();
      setTimeout(() => initMapPicker(currentGps), 300);
    }

    function initMapPicker(gpsStr) {
      let lat = 10.030, lng = 105.770, zoom = 13;
      if (gpsStr && gpsStr.includes(',')) {
        let p = gpsStr.split(',').map(Number);
        if(!isNaN(p[0])) { lat = p[0]; lng = p[1]; zoom = 16; }
      }
      if (!mapPickerObj) {
        mapPickerObj = L.map('mapPicker').setView([lat, lng], zoom);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapPickerObj);
        mapPickerObj.on('click', e => {
          document.getElementById("modalGpsInput").value = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
          setPickerMarker(e.latlng.lat, e.latlng.lng);
        });
      } else {
        mapPickerObj.invalidateSize();
        mapPickerObj.setView([lat, lng], zoom);
      }
      if (gpsStr && gpsStr.includes(',')) {
        let p = gpsStr.split(',').map(Number);
        setPickerMarker(p[0], p[1]);
      }
    }

    function setPickerMarker(lat, lng) {
      if (pickerMarker) pickerMarker.setLatLng([lat, lng]);
      else pickerMarker = L.marker([lat, lng], {draggable: true}).addTo(mapPickerObj);
    }

    async function saveGpsFromModal() {
      const gps = document.getElementById("modalGpsInput").value;
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateApGps", tabName: currentEditingTab, rowIndex: currentEditingRow, gps: gps })
      });
      showToast("Đã lưu GPS!");
      loadApData();
      bootstrap.Modal.getInstance(document.getElementById('gpsPickerModal')).hide();
    }

    function showToast(msg) {
      const c = document.getElementById("toast-container");
      c.insertAdjacentHTML('beforeend', `<div class="toast align-items-center text-white bg-success border-0 shadow show mb-2"><div class="d-flex"><div class="toast-body fw-bold">${msg}</div></div></div>`);
      setTimeout(() => document.querySelector('.toast')?.remove(), 2500);
    }
  </script>
</body>
</html>
