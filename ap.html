<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Ấp & Đồng Bộ - Thu Hồi Nợ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f6f9; font-size: 14px; padding: 10px; }
    .card { border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 12px; border: none; }
    .btn, .form-select { min-height: 38px; }
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; left: 20px; }
  </style>
</head>
<body>

  <div class="container py-2" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-2 rounded shadow-sm">
      <a href="index.html" class="btn btn-outline-dark btn-sm">⬅️ Quay lại</a>
      <h5 class="mb-0 fw-bold text-warning">🏡 Tab Ấp & Đồng Bộ Dữ Liệu</h5>
    </div>

    <!-- KHUNG ĐỒNG BỘ KỲ MỚI VÀO TAB DATA -->
    <div class="card p-3 mb-3 bg-white">
      <h6 class="fw-bold text-primary mb-2">🔄 Đồng Bộ Khách Hàng Từ Kỳ Tháng</h6>
      <p class="small text-muted mb-2">Chọn kỳ tháng cần đồng bộ (hoặc để trống để đồng bộ tất cả các kỳ vào bảng tổng data):</p>
      
      <div class="mb-2">
        <label class="form-label small fw-bold">Chọn Kỳ Tháng:</label>
        <select id="syncMonthSelect" class="form-select form-select-sm">
          <option value="">-- Tất cả các kỳ --</option>
        </select>
      </div>

      <button class="btn btn-primary btn-sm w-100 fw-bold mt-2" onclick="syncDataToDataTab()">
        🚀 Đồng Bộ Khách Vào Tab Data
      </button>
    </div>

    <!-- KHUNG ĐỒNG BỘ ĐỊA CHỈ ẤP -->
    <div class="card p-3 mb-3 bg-white">
      <h6 class="fw-bold text-success mb-2">🏡 Đồng Bộ Địa Chỉ Vào Tab Ấp (New/Old)</h6>
      <button class="btn btn-success btn-sm w-100 fw-bold mb-2" onclick="syncAddressToAp()">
        📍 Trích Xuất Địa Chỉ Ra Tab Ấp
      </button>
      <button class="btn btn-outline-success btn-sm w-100 fw-bold" onclick="assignGpsFromAp()">
        ⚡ Gán Ngược GPS Từ Tab Ấp Vào Khách Hàng
      </button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw4lWwoIpPa3CXyzcKblvOAbFX_kfYm-gV1ckEvUYPvNLYAeASqaFdiYSDkKB-msNDz/exec"; 

    window.onload = function() {
      loadMonthsList();
    };

    async function loadMonthsList() {
      try {
        const res = await fetch(`${API_URL}?action=getMonths`);
        const json = await res.json();
        const select = document.getElementById("syncMonthSelect");
        if(json.months) {
          json.months.forEach(m => {
            const lower = String(m).toLowerCase();
            if (lower !== 'ap_new' && lower !== 'ap_old') {
              select.innerHTML += `<option value="${m}">Kỳ tháng ${m}</option>`;
            }
          });
        }
      } catch(err) {
        console.error(err);
      }
    }

    async function syncDataToDataTab() {
      const targetMonth = document.getElementById("syncMonthSelect").value;
      showToast("Đang tiến hành đồng bộ khách hàng...", "primary");
      
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "syncDataFromSheets", targetMonth: targetMonth })
        });
        const json = await res.json();
        if(json.success) {
          showToast(json.message, "success");
        } else {
          showToast("Lỗi: " + json.error, "danger");
        }
      } catch(err) {
        showToast("Lỗi kết nối server!", "danger");
      }
    }

    async function syncAddressToAp() {
      const targetMonth = document.getElementById("syncMonthSelect").value;
      showToast("Đang trích xuất địa chỉ ấp...", "primary");
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "syncAddressToApTabs", targetMonth: targetMonth })
      });
      const json = await res.json();
      showToast(json.message);
    }

    async function assignGpsFromAp() {
      showToast("Đang gán ngược GPS từ tab ấp...", "primary");
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "assignGpsFromApTabs" })
      });
      const json = await res.json();
      showToast(json.message);
    }

    function showToast(msg, type = "success") {
      const c = document.getElementById("toast-container");
      const id = "toast_" + Date.now();
      c.insertAdjacentHTML('beforeend', `<div id="${id}" class="toast align-items-center text-white bg-${type === 'danger' ? 'danger' : (type === 'primary' ? 'primary' : 'success')} border-0 shadow show mb-2"><div class="d-flex"><div class="toast-body fw-bold">${msg}</div></div></div>`);
      setTimeout(() => document.getElementById(id)?.remove(), 3500);
    }
  </script>
</body>
</html>
