<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Đồ GPS - Thu Hồi Nợ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #f4f6f9; font-size: 15px; margin: 0; padding: 10px; }
    /* Định nghĩa chiều cao cố định rõ ràng để bản đồ hiển thị đầy đủ */
    #map { height: 82vh; width: 100%; border-radius: 12px; border: 1px solid #ccc; }
    .btn, .form-select, .form-control { min-height: 38px; }

    .gps-badge-icon { background: transparent; border: none; }
    .gps-marker-num {
      width: 26px; height: 26px; border-radius: 50%;
      color: white; font-weight: bold; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3); border: 2px solid white;
    }
  </style>
</head>
<body>

  <div class="container-fluid p-2">
    <!-- THANH ĐIỀU HƯỚNG & CÔNG CỤ -->
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm">
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-dark btn-sm me-2">⬅️ Danh sách</a>
        <h5 class="mb-0 fw-bold text-danger">🗺️ Bản Đồ GPS Thực Địa</h5>
      </div>
      <div class="d-flex gap-2">
        <button id="loadMapBtn" class="btn btn-success btn-sm fw-bold" onclick="loadMapDataAndRender()">🔄 Tải Dữ Liệu</button>
        <button class="btn btn-primary btn-sm fw-bold" type="button" data-bs-toggle="offcanvas" data-bs-target="#mapFilterDrawer">
          ⚙️ Lọc
        </button>
      </div>
    </div>

    <!-- KHUNG BẢN ĐỒ -->
    <div id="map" class="shadow-sm"></div>
  </div>

  <!-- OFFCANVAS DRAWER BỘ LỌC BẢN ĐỒ -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="mapFilterDrawer">
    <div class="offcanvas-header bg-danger text-white">
      <h5 class="offcanvas-title fw-bold">⚙️ Lọc Điểm GPS</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      
      <div class="mb-3">
        <label class="form-label fw-bold small">Kỳ tháng:</label>
        <select id="mapMonth" class="form-select" onchange="filterAndRenderMap()">
          <option value="">-- Tất cả tháng --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Tìm kiếm khách hàng:</label>
        <input type="text" id="mapSearch" class="form-control" placeholder="Tên khách, số HĐ..." oninput="filterAndRenderMap()">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng thái HĐ:</label>
        <select id="mapTrangThai" class="form-select" onchange="filterAndRenderMap()">
          <option value="">Tất cả</option>
          <option value="Nợ">Nợ</option>
          <option value="Trả một phần">Trả một phần</option>
          <option value="Tất toán">Tất toán</option>
          <option value="Hứa">Hứa</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng thái Tìm nhà:</label>
        <select id="mapTimNha" class="form-select" onchange="filterAndRenderMap()">
          <option value="">Tất cả</option>
          <option value="Chưa tìm">Chưa tìm</option>
          <option value="Đã tới Ấp">Đã tới Ấp</option>
          <option value="Bỏ địa phương">Bỏ địa phương</option>
          <option value="Có người biết">Có người biết</option>
          <option value="Gặp người thân">Gặp người thân</option>
          <option value="Gặp khách hàng">Gặp khách hàng</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Xác minh Check:</label>
        <select id="mapCheck" class="form-select" onchange="filterAndRenderMap()">
          <option value="">Tất cả</option>
          <option value="Đã Check GPS">📍 Đã Check GPS (Thực tế)</option>
          <option value="Đã Check Áo">🛡️ Đã Check Áo</option>
        </select>
      </div>

      <button class="btn btn-outline-secondary w-100 mt-3" onclick="resetMapFilters()">🔄 Đặt lại lọc</button>
      
      <div class="mt-4 p-2 bg-light rounded text-center small border">
        <b>Chú thích màu & Số thứ tự:</b><br>
        <span class="text-success fw-bold">🟢 Xanh lá: Đã Check GPS</span><br>
        <span class="text-primary fw-bold">🔵 Xanh dương: Chưa check</span><br>
        <i>Ký hiệu trên icon: <b>C</b> (GPS Chính), số <b>1-5</b> (GPS phụ)</i>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzFAqD9A4puhEqUd4tK2AiAIomat8nJd2r2YTPFap682q_SqF5ZqZiM6F0sVrb0PGv9/exec"; 

    let map = null;
    let markersGroup = null;
    let allMapData = [];

    // Tự động khởi tạo bản đồ ngay khi mở trang
    window.onload = function() {
      initMap();
      loadMapDataAndRender();
    };

    function initMap() {
      if (map !== null) return;
      
      // Khởi tạo bản đồ với tọa độ mặc định tại Miền Tây / Cần Thơ
      map = L.map('map').setView([10.030, 105.770], 10);
      
      // Thêm lớp bản đồ nền OpenStreetMap cơ sở
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
    }

    async function loadMapDataAndRender() {
      const btn = document.getElementById("loadMapBtn");
      btn.innerText = "⏳ Đang tải...";
      btn.disabled = true;

      try {
        if(map) {
          map.invalidateSize();
        }

        const resMonths = await fetch(`${API_URL}?action=getMonths`);
        const jsonMonths = await resMonths.json();
        const select = document.getElementById("mapMonth");
        select.innerHTML = '<option value="">-- Tất cả tháng --</option>';
        if(jsonMonths.months) {
          jsonMonths.months.forEach(m => {
            select.innerHTML += `<option value="${m}">Kỳ tháng ${m}</option>`;
          });
        }

        const resData = await fetch(`${API_URL}?action=getData`);
        const jsonData = await resData.json();
        allMapData = jsonData.data || [];
        
        filterAndRenderMap();
        btn.innerText = "✅ Đã tải xong";
        setTimeout(() => { btn.innerText = "🔄 Tải Dữ Liệu"; btn.disabled = false; }, 2000);
      } catch (err) {
        console.error("Lỗi tải dữ liệu bản đồ:", err);
        btn.innerText = "❌ Lỗi tải";
        btn.disabled = false;
      }
    }

    function filterAndRenderMap() {
      if (!markersGroup || !map) return;
      markersGroup.clearLayers();
      map.invalidateSize();

      const monthVal = document.getElementById("mapMonth").value;
      const keyword = document.getElementById("mapSearch").value.toLowerCase();
      const fTrangThai = document.getElementById("mapTrangThai").value;
      const fTimNha = document.getElementById("mapTimNha").value;
      const fCheck = document.getElementById("mapCheck").value;

      const gpsKeys = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];

      allMapData.forEach(item => {
        if (monthVal && String(item.Thang).trim() !== String(monthVal).trim()) return;
        if (keyword) {
          const txt = `${item.Ten_khach_hang || ''} ${item.so_hd || ''}`.toLowerCase();
          if (!txt.includes(keyword)) return;
        }
        if (fTrangThai && item.Trang_thai_hd !== fTrangThai) return;
        if (fTimNha && item.Trang_thai_tim_nha !== fTimNha) return;
        if (fCheck && item.Check_GPS !== fCheck && item.Check_Ao !== fCheck) return;

        const isCheckedGps = item.Check_GPS === 'Đã Check GPS';
        const markerBgColor = isCheckedGps ? '#198754' : '#0d6efd';

        gpsKeys.forEach((key, idx) => {
          if (item[key] && String(item[key]).includes(',')) {
            const parts = item[key].split(',');
            const lat = parseFloat(parts[0].trim());
            const lng = parseFloat(parts[1].trim());

            if (!isNaN(lat) && !isNaN(lng)) {
              const labelNum = key === 'GPS_Chinh' ? 'C' : String(idx);
              const labelName = key === 'GPS_Chinh' ? 'GPS Chính' : `GPS ${idx}`;

              const customIcon = L.divIcon({
                className: 'gps-badge-icon',
                html: `<div class="gps-marker-num" style="background-color: ${markerBgColor};">${labelNum}</div>`,
                iconSize: [26, 26],
                iconAnchor: [13, 13]
              });

              const marker = L.marker([lat, lng], { icon: customIcon });

              marker.bindPopup(`
                <div style="font-size: 14px; min-width: 200px;">
                  <b style="color:#0d6efd; font-size: 15px;">${item.Ten_khach_hang || ''}</b><br>
                  <small class="text-muted"><b>Điểm:</b> ${labelName} (${isCheckedGps ? '🟢 Đã Check' : '🔵 Chưa check'})</small><br>
                  <hr class="my-1">
                  <b>Số HĐ:</b> <code>${item.so_hd || '---'}</code><br>
                  <b>SĐT:</b> ${item.sdt || '---'}<br>
                  <b>Trạng thái:</b> ${item.Trang_thai_hd || 'Nợ'}<br>
                  <b>Tìm nhà:</b> ${item.Trang_thai_tim_nha || 'Chưa tìm'}<br>
                  <b>Check:</b> ${item.Check_GPS || item.Check_Ao || 'Chưa check'}<br>
                  <hr class="my-1">
                  <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="btn btn-sm btn-danger text-white w-100 fw-bold mt-1 p-2" style="font-size:13px;">🧭 DẪN ĐƯỜNG GOOGLE MAPS</a>
                </div>
              `);
              markersGroup.addLayer(marker);
            }
          }
        });
      });
    }

    function resetMapFilters() {
      document.getElementById("mapMonth").value = "";
      document.getElementById("mapSearch").value = "";
      document.getElementById("mapTrangThai").value = "";
      document.getElementById("mapTimNha").value = "";
      document.getElementById("mapCheck").value = "";
      filterAndRenderMap();
    }
  </script>
</body>
</html>
