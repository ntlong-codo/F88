<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản Đồ GPS - Bộ Lọc Nâng Cao</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 75vh; width: 100%; border-radius: 10px; }
  </style>
</head>
<body class="bg-light">
  <div class="container-fluid p-3">
    <div class="row align-items-center mb-2">
      <div class="col-md-3 d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-dark me-3">⬅️ Danh sách</a>
        <h4 class="mb-0">🗺️ Bản Đồ GPS</h4>
      </div>
    </div>

    <!-- THANH BỘ LỌC TRÊN BẢN ĐỒ -->
    <div class="card p-2 mb-2 shadow-sm">
      <div class="row g-2 align-items-center">
        <div class="col-md-2">
          <select id="mapMonth" class="form-select form-select-sm" onchange="filterAndRenderMap()">
            <option value="">-- Tất cả tháng --</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" id="mapSearch" class="form-control form-select-sm" placeholder="Tìm tên, HĐ..." oninput="filterAndRenderMap()">
        </div>
        <div class="col-md-2">
          <select id="mapTrangThai" class="form-select form-select-sm" onchange="filterAndRenderMap()">
            <option value="">Trạng thái HĐ (Tất cả)</option>
            <option value="Nợ">Nợ</option>
            <option value="Trả một phần">Trả một phần</option>
            <option value="Tất toán">Tất toán</option>
            <option value="Hứa">Hứa</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="mapTimNha" class="form-select form-select-sm" onchange="filterAndRenderMap()">
            <option value="">Tìm nhà (Tất cả)</option>
            <option value="Chưa tìm">Chưa tìm</option>
            <option value="Dễ tìm">Dễ tìm</option>
            <option value="Khó tìm">Khó tìm</option>
            <option value="Không tìm thấy">Không tìm thấy</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="mapCheck" class="form-select form-select-sm" onchange="filterAndRenderMap()">
            <option value="">Trạng thái Check (Tất cả)</option>
            <option value="Đã Check GPS">Đã Check GPS</option>
            <option value="Đã Check Áo">Đã Check Áo</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-secondary btn-sm w-100" onclick="resetMapFilters()">Đặt lại lọc</button>
        </div>
      </div>
    </div>

    <div id="map" class="shadow"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzh3d9qWgoJCwwP6DqDWLIeBDOkOIZqJW8e-nnas23CZpJRFW-w1umUCmE74KOrqLO4/exec"; 
    let map, markersGroup;
    let allMapData = [];

    function initMap() {
      map = L.map('map').setView([10.030, 105.770], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      loadMapData();
    }

    async function loadMapData() {
      const resMonths = await fetch(`${API_URL}?action=getMonths`);
      const jsonMonths = await resMonths.json();
      const select = document.getElementById("mapMonth");
      jsonMonths.months.forEach(m => {
        select.innerHTML += `<option value="${m}">Kỳ tháng ${m}</option>`;
      });

      const resData = await fetch(`${API_URL}?action=getData`);
      const jsonData = await resData.json();
      allMapData = jsonData.data || [];
      filterAndRenderMap();
    }

    function filterAndRenderMap() {
      markersGroup.clearLayers();

      const monthVal = document.getElementById("mapMonth").value;
      const keyword = document.getElementById("mapSearch").value.toLowerCase();
      const fTrangThai = document.getElementById("mapTrangThai").value;
      const fTimNha = document.getElementById("mapTimNha").value;
      const fCheck = document.getElementById("mapCheck").value;

      const gpsKeys = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];

      allMapData.forEach(item => {
        if (monthVal && String(item.Thang).trim() !== String(monthVal).trim()) return;
        if (keyword) {
          const txt = `${item.Ten_khach_hang || ''} ${item.so_hd || ''}`.toLowerCase();
          if (!txt.includes(keyword)) return;
        }
        if (fTrangThai && item.Trang_thai_hd !== fTrangThai) return;
        if (fTimNha && item.Trang_thai_tim_nha !== fTimNha) return;
        if (fCheck && item.Check_GPS !== fCheck && item.Check_Ao !== fCheck) return;

        const isCheckedGps = item.Check_GPS === 'Đã Check GPS';
        const markerColor = isCheckedGps ? 'green' : 'blue';

        gpsKeys.forEach((key, idx) => {
          if (item[key] && String(item[key]).includes(',')) {
            const parts = item[key].split(',');
            const lat = parseFloat(parts[0].trim());
            const lng = parseFloat(parts[1].trim());

            if (!isNaN(lat) && !isNaN(lng)) {
              const labelName = key === 'GPS_Chinh' ? 'GPS Chính' : `GPS ${idx}`;
              const circleMarker = L.circleMarker([lat, lng], {
                color: markerColor,
                fillColor: markerColor,
                fillOpacity: 0.8,
                radius: isCheckedGps ? 9 : 7
              });

              circleMarker.bindPopup(`
                <div style="font-size: 13px;">
                  <b style="color:#0d6efd;">${item.Ten_khach_hang || ''}</b> (${labelName})<br>
                  <b>HĐ:</b> ${item.so_hd || '---'}<br>
                  <b>SĐT:</b> ${item.sdt || '---'}<br>
                  <b>Trạng thái:</b> ${item.Trang_thai_hd || '---'} | <b>Tìm nhà:</b> ${item.Trang_thai_tim_nha || '---'}<br>
                  <b>Check:</b> ${item.Check_GPS || item.Check_Ao || 'Chưa'}<br>
                  <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="btn btn-sm btn-danger text-white w-100 mt-1">🧭 Dẫn đường Google Maps</a>
                </div>
              `);
              markersGroup.addLayer(circleMarker);
            }
          }
        });
      });
    }

    function resetMapFilters() {
      document.getElementById("mapMonth").value = "";
      document.getElementById("mapSearch").value = "";
      document.getElementById("mapTrangThai").value = "";
      document.getElementById("mapTimNha").value = "";
      document.getElementById("mapCheck").value = "";
      filterAndRenderMap();
    }

    window.onload = initMap;
  </script>
</body>
</html>
