<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản Đồ GPS Khách Hàng</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 85vh; width: 100%; border-radius: 10px; }
  </style>
</head>
<body class="bg-light">
  <div class="container-fluid p-3">
    <div class="row align-items-center mb-3">
      <div class="col-md-4 d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-dark me-3">⬅️ Danh sách</a>
        <h4 class="mb-0">🗺️ Bản Đồ GPS Thực Địa</h4>
      </div>
      <div class="col-md-4">
        <select id="monthSelectMap" class="form-select" onchange="loadMapData()">
          <option value="">-- Tất cả các tháng --</option>
        </select>
      </div>
      <div class="col-md-4 text-end small">
        <span class="badge bg-success me-1">🟢 Đã Check GPS</span>
        <span class="badge bg-primary me-1">🔵 GPS Chưa Xác Nhận</span>
      </div>
    </div>

    <div id="map" class="shadow"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // THAY LINK WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY
    const API_URL = "https://script.google.com/macros/s/AKfycbxvu0vDCyMQQ2XMtM7MmnXI2MXJZFZWBmggc88RE1T1xEqmMtuixnTNpsfBya-ujanF/exec"; 
    let map, markersGroup;

    function initMap() {
      // Khởi tạo vị trí trung tâm bản đồ
      map = L.map('map').setView([10.030, 105.770], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      loadMonths();
    }

    async function loadMonths() {
      try {
        const res = await fetch(`${API_URL}?action=getMonths`);
        const json = await res.json();
        const select = document.getElementById("monthSelectMap");
        json.months.forEach(m => {
          select.innerHTML += `<option value="${m}">Kỳ tháng ${m}</option>`;
        });
        loadMapData();
      } catch (err) {
        alert("Lỗi kết nối API lấy danh sách tháng!");
      }
    }

    async function loadMapData() {
      markersGroup.clearLayers();
      const month = document.getElementById("monthSelectMap").value;
      
      const res = await fetch(`${API_URL}?action=getData&month=${month}`);
      const json = await res.json();
      const data = json.data || [];

      const gpsKeys = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];

      data.forEach(item => {
        // Đổi màu điểm đánh dấu: Đã Check GPS -> Màu Xanh lá, Chưa -> Màu Xanh dương
        const isCheckedGps = item.Check_GPS === 'Đã Check GPS';
        const markerColor = isCheckedGps ? 'green' : 'blue';

        gpsKeys.forEach((key, idx) => {
          if (item[key] && typeof item[key] === 'string' && item[key].includes(',')) {
            const parts = item[key].split(',');
            const lat = parseFloat(parts[0].trim());
            const lng = parseFloat(parts[1].trim());

            if (!isNaN(lat) && !isNaN(lng)) {
              const labelName = key === 'GPS_Chinh' ? 'GPS Chính' : `GPS ${idx}`;
              
              const circleMarker = L.circleMarker([lat, lng], {
                color: markerColor,
                fillColor: markerColor,
                fillOpacity: 0.8,
                radius: isCheckedGps ? 9 : 7
              });

              circleMarker.bindPopup(`
                <div style="font-size: 13px;">
                  <b style="color:#0d6efd;">${item.Ten_khach_hang || 'Khách hàng'}</b> (${labelName})<br>
                  <b>Số HĐ:</b> ${item.so_hd || '---'}<br>
                  <b>SĐT:</b> ${item.sdt || '---'}<br>
                  <b>Trạng thái HĐ:</b> ${item.Trang_thai_hd || '---'}<br>
                  <b>Tìm nhà:</b> ${item.Trang_thai_tim_nha || '---'}<br>
                  <b>Đánh dấu Check:</b> ${item.Check_GPS || item.Check_Ao || 'Chưa check'}<br>
                  <b>Ghi chú:</b> ${item.Ghi_chu || 'Không có'}<br>
                  <hr class="my-1">
                  <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="btn btn-sm btn-danger text-white w-100 style="font-size:11px;">🧭 Mở chỉ đường Google Maps</a>
                </div>
              `);

              markersGroup.addLayer(circleMarker);
            }
          }
        });
      });
    }

    window.onload = initMap;
  </script>
</body>
</html>
