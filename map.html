<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Đồ GPS - Thu Hồi Nợ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #f4f6f9; font-size: 15px; margin: 0; padding: 10px; }
    #map { height: 78vh; width: 100%; border-radius: 12px; border: 1px solid #ccc; background-color: #e5e3df; }
    .btn, .form-select, .form-control { min-height: 38px; }
    .gps-badge-icon { background: transparent; border: none; }
    .gps-marker-num {
      width: 26px; height: 26px; border-radius: 50%; color: white; font-weight: bold; font-size: 11px;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); border: 2px solid white;
    }
    .my-location-marker { background-color: #dc3545; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <div class="container-fluid p-2">
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm flex-wrap gap-2">
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-dark btn-sm me-2">⬅️ Danh sách</a>
        <h5 class="mb-0 fw-bold text-danger">🗺️ Bản Đồ GPS (8 Điểm)</h5>
      </div>
      <div class="d-flex gap-1 flex-wrap">
        <button class="btn btn-danger btn-sm fw-bold" onclick="locateMyPosition()">📍 Định Vị</button>
        <button id="loadMapBtn" class="btn btn-success btn-sm fw-bold" onclick="loadMapDataAndRender()">🔄 Tải Dữ Liệu</button>
        <button class="btn btn-primary btn-sm fw-bold" type="button" data-bs-toggle="offcanvas" data-bs-target="#mapFilterDrawer">⚙️ Lọc</button>
      </div>
    </div>
    <div id="map" class="shadow-sm"></div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="mapFilterDrawer">
    <div class="offcanvas-header bg-danger text-white">
      <h5 class="offcanvas-title fw-bold">⚙️ Bộ Lọc Bản Đồ</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label class="form-label fw-bold small">Kỳ tháng:</label>
        <select id="mapMonth" class="form-select" onchange="filterAndRenderMap()"><option value="">-- Tất cả tháng --</option></select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tìm kiếm:</label>
        <input type="text" id="mapSearch" class="form-control" placeholder="Tên khách, số HĐ..." oninput="filterAndRenderMap()">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Khả Năng Thanh Toán:</label>
        <select id="mapTrangThai" class="form-select" onchange="filterAndRenderMap()">
          <option value="">Tất cả</option><option value="Chưa biết">Chưa biết</option><option value="Ăn Giựt">Ăn Giựt</option><option value="Mất khả năng TT">Mất khả năng TT</option><option value="Đang kẹt tiền">Đang kẹt tiền</option><option value="Có khả năng">Có khả năng</option><option value="Hẹn Thanh Toán">Hẹn Thanh Toán</option>
        </select>
      </div>
      <button class="btn btn-outline-secondary w-100 mt-3" onclick="resetMapFilters()">🔄 Đặt lại lọc</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyNt0upTCrxqOWgXsbZMW1PcpI01zJqbCLCw3cH09Vt7U33TBIBdyNb4RaIWwtLBRIB/exec"; 
    let map = null; let markersGroup = null; let myLocationMarker = null; let myCoords = null; let allMapData = [];

    window.onload = function() { initMap(); locateMyPosition(); loadMapDataAndRender(); };

    function initMap() {
      if (map !== null) return;
      map = L.map('map').setView([10.030, 105.770], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);
    }

    function locateMyPosition() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos => {
        myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (myLocationMarker) map.removeLayer(myLocationMarker);
        myLocationMarker = L.marker([myCoords.lat, myCoords.lng], { icon: L.divIcon({className: 'my-location-marker', iconSize: [16,16], iconAnchor: [8,8]}) }).addTo(map).bindPopup("<b>📍 Bạn ở đây</b>");
        map.setView([myCoords.lat, myCoords.lng], 15); filterAndRenderMap();
      }, () => {}, { enableHighAccuracy: true });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(2);
    }

    async function loadMapDataAndRender() {
      const btn = document.getElementById("loadMapBtn"); btn.innerText = "⏳ Đang tải..."; btn.disabled = true;
      try {
        const resMonths = await fetch(`${API_URL}?action=getMonths`);
        const jsonMonths = await resMonths.json();
        const select = document.getElementById("mapMonth"); select.innerHTML = '<option value="">-- Tất cả tháng --</option>';
        
        const now = new Date();
        const currentMmyyyy = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();

        if(jsonMonths.months) {
          jsonMonths.months.forEach(m => {
            select.innerHTML += `<option value="${m}">Kỳ tháng ${m}</option>`;
          });
        }
        select.value = currentMmyyyy;

        const resData = await fetch(`${API_URL}?action=getData`);
        const jsonData = await resData.json();
        allMapData = jsonData.data || [];
        
        if(map) map.invalidateSize();
        filterAndRenderMap();
        btn.innerText = "✅ Xong"; setTimeout(() => { btn.innerText = "🔄 Tải Dữ Liệu"; btn.disabled = false; }, 2000);
      } catch (err) { btn.innerText = "❌ Lỗi"; btn.disabled = false; }
    }

    function filterAndRenderMap() {
      if (!markersGroup || !map) return;
      markersGroup.clearLayers(); 

      const monthVal = document.getElementById("mapMonth").value;
      const keyword = document.getElementById("mapSearch").value.toLowerCase();
      const fTrangThai = document.getElementById("mapTrangThai").value;

      // QUÉT ĐỦ 8 ĐIỂM GPS (6 CỘT CŨ + 2 CỘT AP_NEW, AP_OLD)
      const gpsKeys = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5', 'GPS_AP_NEW', 'GPS_AP_OLD'];
      const gpsLabels = { 
        'GPS_Chinh': 'GPS Chính', 'GPS_1': 'GPS 1', 'GPS_2': 'GPS 2', 
        'GPS_3': 'GPS 3', 'GPS_4': 'GPS 4', 'GPS_5': 'GPS 5', 
        'GPS_AP_NEW': 'GPS Ấp New', 'GPS_AP_OLD': 'GPS Ấp Old' 
      };

      allMapData.forEach(item => {
        if (monthVal && String(item.Thang).trim() !== String(monthVal).trim()) return;
        if (keyword && !`${item.Ten_khach_hang || ''} ${item.so_hd || ''}`.toLowerCase().includes(keyword)) return;
        if (fTrangThai && item.Trang_thai_hd !== fTrangThai) return;

        const isPaid = item.So_tien_thanh_toan && Number(item.So_tien_thanh_toan) > 0;
        const opacity = isPaid ? 0.35 : 0.9;
        const color = item.Check_GPS === 'Đã Check GPS' ? '#198754' : '#0d6efd';

        gpsKeys.forEach((key, idx) => {
          if (item[key] && String(item[key]).includes(',')) {
            let p = item[key].split(',');
            let lat = parseFloat(p[0].trim()); let lng = parseFloat(p[1].trim());
            if (!isNaN(lat) && !isNaN(lng)) {
              let distHtml = myCoords ? `<br><b>📍 Khoảng cách:</b> <span class="text-danger fw-bold">${calculateDistance(myCoords.lat, myCoords.lng, lat, lng)} km</span>` : '';
              let labelText = key.includes('AP') ? (key.includes('NEW') ? 'New' : 'Old') : (key === 'GPS_Chinh' ? 'C' : idx);

              let marker = L.marker([lat, lng], {
                icon: L.divIcon({ className: 'gps-badge-icon', html: `<div class="gps-marker-num" style="background-color: ${color}; opacity: ${opacity};">${labelText}</div>`, iconSize: [26,26], iconAnchor: [13,13] })
              });

              marker.bindPopup(`
                <div style="font-size: 13px; min-width: 210px; line-height: 1.4;">
                  <b style="color:#0d6efd; font-size: 15px;">${item.Ten_khach_hang || ''}</b><br>
                  <small class="text-muted"><b>Điểm:</b> ${gpsLabels[key]} ${isPaid ? '(Đã TT)' : ''}</small>
                  ${distHtml}
                  <hr class="my-1">
                  <b>Số HĐ:</b> <code>${item.so_hd || '---'}</code><br>
                  <b>Khả năng:</b> ${item.Trang_thai_hd || 'Chưa biết'}<br>
                  <b>Đã TT:</b> ${isPaid ? Number(item.So_tien_thanh_toan).toLocaleString() + ' VNĐ' : 'Chưa'}<br>
                  <hr class="my-1">
                  <b>🏠 Thường trú:</b> ${item.WARD_HO_KHAU || '---'}<br>
                  <b>🏡 Ấp New:</b> ${item.WARD_HO_KHAU_AP_NEW || '---'}<br>
                  <b>🏡 Ấp Old:</b> ${item.WARD_HO_KHAU_AP_OLD || '---'}<br>
                  <b>📝 Ghi chú:</b> <span class="text-success">${item.Ghi_chu || 'Chưa có'}</span>
                  <hr class="my-1">
                  <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="btn btn-sm btn-danger text-white w-100 fw-bold mt-1 p-2">🧭 DẪN ĐƯỜNG GOOGLE MAPS</a>
                </div>
              `);
              markersGroup.addLayer(marker);
            }
          }
        });
      });
    }

    function resetMapFilters() {
      const now = new Date();
      const currentMmyyyy = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();
      document.getElementById("mapMonth").value = currentMmyyyy; 
      document.getElementById("mapSearch").value = ""; 
      document.getElementById("mapTrangThai").value = "";
      filterAndRenderMap();
    }
  </script>
</body>
</html>
