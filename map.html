<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Đồ GPS - Thu Hồi Nợ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #f4f6f9; font-size: 14px; margin: 0; padding: 5px; height: 100vh; overflow: hidden; }
    .main-wrapper { display: flex; height: 92vh; gap: 8px; }
    .sidebar-panel { width: 400px; background: #fff; border-radius: 12px; border: 1px solid #ccc; display: flex; flex-direction: column; padding: 10px; }
    .customer-item-card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .map-panel { flex-grow: 1; height: 100%; border-radius: 12px; }
    #map { height: 100%; width: 100%; border-radius: 12px; }
    .gps-marker-num { width: 26px; height: 26px; border-radius: 50%; color: white; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .my-location-marker { background-color: #dc3545; border: 3px solid white; border-radius: 50%; }
  </style>
</head>
<body>

  <div class="container-fluid p-1">
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm">
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-outline-dark btn-sm me-2">⬅️ Danh sách</a>
        <h5 class="mb-0 fw-bold text-danger">🗺️ Bản Đồ GPS</h5>
      </div>
      <div class="d-flex gap-1">
        <select id="mapMonth" class="form-select form-select-sm" onchange="loadMapData()"></select>
      </div>
    </div>

    <div class="main-wrapper">
      <div class="sidebar-panel">
        <h6 class="fw-bold text-primary mb-2">📋 Khách hàng</h6>
        <div id="sidebarCustomerList" style="overflow-y: auto; flex-grow: 1;"></div>
      </div>
      <div class="map-panel shadow-sm">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwUE4uo5kihhrficlHTWtTeUDNy0n-vo49osANuoD17KzkueUzABRxUVgKzIwza-AW9/exec"; 
    let map = null, markersGroup = null, myCoords = null, allMapData = [];

    window.onload = function() {
      initMap();
      loadMonthsAndData();
    };

    function initMap() {
      map = L.map('map').setView([10.030, 105.770], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      markersGroup = L.layerGroup().addTo(map);
      navigator.geolocation.getCurrentPosition(pos => {
        myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        L.marker([myCoords.lat, myCoords.lng], {
          icon: L.divIcon({className: 'my-location-marker', iconSize: [16,16]})
        }).addTo(map);
        map.setView([myCoords.lat, myCoords.lng], 15);
      });
    }

    async function loadMonthsAndData() {
      const res = await fetch(`${API_URL}?action=getMonths`);
      const json = await res.json();
      const sel = document.getElementById("mapMonth");
      const now = new Date();
      const currentMmyyyy = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();

      if(json.months) {
        json.months.forEach(m => {
          if (m !== 'ap_new' && m !== 'ap_old') sel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
        });
      }
      sel.value = currentMmyyyy;
      loadMapData();
    }

    async function loadMapData() {
      const month = document.getElementById("mapMonth").value;
      const res = await fetch(`${API_URL}?action=getData&month=${month}`);
      const json = await res.json();
      allMapData = json.data || [];
      renderMapAndList();
    }

    function renderMapAndList() {
      markersGroup.clearLayers();
      const container = document.getElementById("sidebarCustomerList");
      container.innerHTML = "";

      allMapData.forEach(item => {
        let hasGps = false;
        ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'].forEach(k => {
          let val = item[k];
          if (val && val.includes(',')) {
            hasGps = true;
            let p = val.split(',').map(Number);
            let marker = L.marker([p[0], p[1]], {
              icon: L.divIcon({className: 'gps-marker-icon', html: `<div class="gps-marker-num bg-primary">C</div>`, iconSize: [26,26]})
            }).addTo(markersGroup);
            marker.bindPopup(`<b>${item.Ten_khach_hang}</b><br>HĐ: ${item.so_hd || item['số hđ']}`);
          }
        });

        if (hasGps) {
          container.innerHTML += `
            <div class="customer-item-card">
              <div class="fw-bold text-primary">${item.Ten_khach_hang}</div>
              <small class="text-muted">HĐ: ${item.so_hd || item['số hđ']}</small>
            </div>
          `;
        }
      });
    }
  </script>
</body>
</html>
