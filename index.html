<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thu Hồi Nợ - Mobile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f6f9; font-size: 15px; }
    .customer-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 12px; padding: 14px; border-left: 5px solid #0d6efd; }
    .row-check-ao { border-left-color: #6f42c1 !important; background-color: #fbf7ff !important; } 
    .row-check-gps { border-left-color: #198754 !important; background-color: #f2f9f4 !important; } 
    .sub-section { border-left: 3px solid #0d6efd; padding-left: 10px; margin-top: 10px; }
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; left: 20px; }
    #toast-container .toast { width: 100%; max-width: 100%; }
    
    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
    }
    .btn, .form-select, .form-control { min-height: 42px; }
  </style>
</head>
<body>

  <!-- FRAME KHÓA MẬT KHẨU -->
  <div id="authOverlay">
    <div class="card p-4 shadow-lg text-center" style="max-width: 380px; width: 90%;">
      <h4 class="mb-3">🔐 BẢO MẬT HỆ THỐNG</h4>
      <p class="text-muted small">Nhập mật khẩu để tiếp tục (Lưu đăng nhập 24h)</p>
      <input type="password" id="passInput" class="form-control mb-3 text-center fs-5" placeholder="Nhập mật khẩu..." onkeyup="if(event.key==='Enter') checkAuth()">
      <button class="btn btn-primary w-100 fw-bold" onclick="checkAuth()">XÁC NHẬN ĐĂNG NHẬP</button>
      <div id="authError" class="text-danger small mt-2 d-none">Mật khẩu không chính xác!</div>
    </div>
  </div>

  <!-- NỘI DUNG CHÍNH WEBSITE -->
  <div class="container py-3 px-2 d-none" id="mainContent">
    
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm">
      <h5 class="mb-0 fw-bold text-primary">📋 Thu Hồi Nợ</h5>
      <div>
        <button class="btn btn-warning btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#syncModal">🔄 Đồng bộ</button>
        <a href="map.html" class="btn btn-danger btn-sm fw-bold">🗺️ Bản đồ</a>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">🔒</button>
      </div>
    </div>

    <!-- KHUNG BỘ ĐẾM THỰC ĐỊA -->
    <div class="card p-2 mb-2 bg-white shadow-sm text-center">
      <div class="row small fw-bold">
        <div class="col-6 border-end">🛡️ Đã Check Tháng Này: <span id="countMonth" class="text-primary">0</span></div>
        <div class="col-6">📊 Tổng Đã Check: <span id="countTotal" class="text-success">0</span></div>
      </div>
    </div>

    <!-- THANH TÌM KIẾM VÀ NÚT MỞ BỘ LỌC -->
    <div class="input-group mb-3 shadow-sm">
      <input type="text" id="searchKeyword" class="form-control" placeholder="🔍 Tìm tên, số HĐ, SĐT..." oninput="filterData()">
      <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterDrawer">
        ⚙️ Lọc (<span id="activeFilterCount">0</span>)
      </button>
    </div>

    <div id="customerCardContainer">
      <div class="text-center py-5 text-muted">Đang tải dữ liệu khách hàng...</div>
    </div>
  </div>

  <!-- OFFCANVAS DRAWER BỘ LỌC -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title">⚙️ Bộ Lọc Nâng Cao</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label class="form-label fw-bold small">Kỳ tháng:</label>
        <select id="filterMonth" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">-- Tất cả tháng --</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng thái HĐ:</label>
        <select id="filterTrangThaiHd" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Nợ">Nợ</option>
          <option value="Trả một phần">Trả một phần</option>
          <option value="Tất toán">Tất toán</option>
          <option value="Hứa">Hứa</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tìm nhà:</label>
        <select id="filterTimNha" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Chưa tìm">Chưa tìm</option>
          <option value="Đã tới Ấp">Đã tới Ấp</option>
          <option value="Bỏ địa phương">Bỏ địa phương</option>
          <option value="Có người biết">Có người biết</option>
          <option value="Gặp người thân">Gặp người thân</option>
          <option value="Gặp khách hàng">Gặp khách hàng</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Độ khó khách hàng:</label>
        <select id="filterDoKho" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Chưa biết">Chưa biết</option>
          <option value="Dễ làm việc">Dễ làm việc</option>
          <option value="Trung lập">Trung lập</option>
          <option value="Khó Tính">Khó Tính</option>
          <option value="Không hợp tác">Không hợp tác</option>
          <option value="Bạo lực">Bạo lực</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng thái Check:</label>
        <select id="filterCheck" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="DaCheckGps">Đã Check GPS</option>
          <option value="DaCheckAo">Đã Check Áo</option>
          <option value="ChuaCheck">Chưa check</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tọa độ GPS:</label>
        <select id="filterHasGps" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="HasGps">Có GPS</option>
          <option value="NoGps">Chưa có GPS</option>
        </select>
      </div>
      <button class="btn btn-outline-danger w-100 mt-2" onclick="resetFilters()">🔄 Đặt lại bộ lọc</button>
    </div>
  </div>

  <!-- MODAL ĐỒNG BỘ -->
  <div class="modal fade" id="syncModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">🔄 Đồng Bộ Dữ Liệu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-3">Cập nhật thông tin từ Sheet tháng, giữ nguyên dữ liệu thực địa cũ.</p>
          <div class="mb-3">
            <label class="form-label fw-bold">Chọn kỳ tháng:</label>
            <select id="syncMonthSelect" class="form-select">
              <option value="">⚡ Đồng bộ TẤT CẢ các tháng</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="button" class="btn btn-primary" onclick="executeSync()">Thực hiện</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzFAqD9A4puhEqUd4tK2AiAIomat8nJd2r2YTPFap682q_SqF5ZqZiM6F0sVrb0PGv9/exec"; 
    const AUTH_KEY = "app_auth_session";
    const AUTH_PASS = "124985";
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;

    let allRawData = [];

    window.onload = function() { checkSession(); };

    function checkSession() {
      try {
        const rawData = localStorage.getItem(AUTH_KEY);
        if (!rawData) { showLoginScreen(); return; }
        const authData = JSON.parse(rawData);
        const now = new Date().getTime();
        if (authData.pass === AUTH_PASS && authData.expiry && now < authData.expiry) {
          document.getElementById("authOverlay").style.display = "none";
          document.getElementById("mainContent").classList.remove("d-none");
          init();
        } else { showLoginScreen(); }
      } catch (e) { showLoginScreen(); }
    }

    function showLoginScreen() {
      document.getElementById("authOverlay").style.display = "flex";
      document.getElementById("mainContent").classList.add("d-none");
    }

    function checkAuth() {
      const inputEl = document.getElementById("passInput");
      const errorDiv = document.getElementById("authError");
      if (inputEl.value.trim() === AUTH_PASS) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({ pass: AUTH_PASS, expiry: new Date().getTime() + ONE_DAY_MS }));
        errorDiv.classList.add("d-none");
        checkSession();
      } else {
        errorDiv.classList.remove("d-none");
        inputEl.value = ""; inputEl.focus();
      }
    }

    function logout() { localStorage.removeItem(AUTH_KEY); location.reload(); }

    async function init() {
      try {
        const res = await fetch(`${API_URL}?action=getMonths`);
        const json = await res.json();
        const filterSel = document.getElementById("filterMonth");
        const syncSel = document.getElementById("syncMonthSelect");
        if(json.months) {
          json.months.forEach(m => {
            if(filterSel) filterSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
            if(syncSel) syncSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
          });
        }
        loadCustomerData();
      } catch(err) { console.error("Lỗi khởi tạo:", err); }
    }

    async function loadCustomerData() {
      const res = await fetch(`${API_URL}?action=getData`);
      const json = await res.json();
      allRawData = json.data || [];
      filterData();
      updateCounters(allRawData);
    }

    function updateCounters(data) {
      let totalChecked = 0;
      let monthChecked = 0;
      const now = new Date();
      const currentMonthStr = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();

      data.forEach(item => {
        const isChecked = (item.Check_GPS === 'Đã Check GPS' || item.Check_Ao === 'Đã Check Áo');
        if (isChecked) {
          totalChecked++;
          if (String(item.Thang).trim() === currentMonthStr) {
            monthChecked++;
          }
        }
      });

      document.getElementById("countTotal").innerText = totalChecked;
      document.getElementById("countMonth").innerText = monthChecked;
    }

    function updateFilterCount() {
      let count = 0;
      if(document.getElementById("filterMonth").value) count++;
      if(document.getElementById("filterTrangThaiHd").value) count++;
      if(document.getElementById("filterTimNha").value) count++;
      if(document.getElementById("filterDoKho").value) count++;
      if(document.getElementById("filterCheck").value) count++;
      if(document.getElementById("filterHasGps").value) count++;
      document.getElementById("activeFilterCount").innerText = count;
    }

    function filterData() {
      const monthVal = document.getElementById("filterMonth").value;
      const keyword = document.getElementById("searchKeyword").value.toLowerCase();
      const fTrangThai = document.getElementById("filterTrangThaiHd").value;
      const fTimNha = document.getElementById("filterTimNha").value;
      const fDoKho = document.getElementById("filterDoKho").value;
      const fCheck = document.getElementById("filterCheck").value;
      const fHasGps = document.getElementById("filterHasGps").value;

      let filtered = allRawData.filter(item => {
        if (monthVal && String(item.Thang).trim() !== String(monthVal).trim()) return false;
        if (keyword) {
          const textSearch = `${item.Ten_khach_hang || ''} ${item.so_hd || ''} ${item.sdt || ''}`.toLowerCase();
          if (!textSearch.includes(keyword)) return false;
        }
        if (fTrangThai && item.Trang_thai_hd !== fTrangThai) return false;
        if (fTimNha && item.Trang_thai_tim_nha !== fTimNha) return false;
        if (fDoKho && item.Muc_do_kho !== fDoKho) return false;
        if (fCheck === 'DaCheckGps' && item.Check_GPS !== 'Đã Check GPS') return false;
        if (fCheck === 'DaCheckAo' && item.Check_Ao !== 'Đã Check Áo') return false;
        if (fCheck === 'ChuaCheck' && (item.Check_GPS === 'Đã Check GPS' || item.Check_Ao === 'Đã Check Áo')) return false;

        const gpsFields = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];
        const hasAnyGps = gpsFields.some(k => item[k] && String(item[k]).includes(','));
        if (fHasGps === 'HasGps' && !hasAnyGps) return false;
        if (fHasGps === 'NoGps' && hasAnyGps) return false;

        return true;
      });

      renderCards(filtered);
    }

    function renderCards(data) {
      const container = document.getElementById("customerCardContainer");
      if(data.length === 0) {
        container.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Không tìm thấy khách hàng phù hợp.</div>`;
        return;
      }

      container.innerHTML = data.map((item, idx) => {
        let cardStyleClass = "";
        if (item.Check_GPS === 'Đã Check GPS') {
          cardStyleClass = "row-check-gps";
        } else if (item.Check_Ao === 'Đã Check Áo') {
          cardStyleClass = "row-check-ao";
        }

        const gpsFields = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];
        const countGps = gpsFields.filter(k => item[k] && String(item[k]).includes(',')).length;
        const gpsBadge = countGps > 0 ? `<span class="badge bg-primary">${countGps} GPS</span>` : `<span class="badge bg-light text-dark">0 GPS</span>`;
        const collapseId = `collapseCard_${idx}`;

        return `
          <div class="customer-card ${cardStyleClass}">
            <!-- Dòng 1: Tên, Số HĐ và Dropdown Tìm nhà ở góc phải -->
            <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
              <div>
                <h6 class="fw-bold text-primary mb-1">${item.Ten_khach_hang || 'Chưa có tên'}</h6>
                <small class="text-muted">HĐ: <code>${item.so_hd || ''}</code></small>
                <button class="btn btn-sm btn-link p-0 ms-1" onclick="copyToClipboard('${item.so_hd}')" title="Copy số hợp đồng">📋</button>
              </div>
              <div style="width: 140px;">
                <select class="form-select form-select-sm fw-bold border-primary" onchange="updateFieldAndNotify(${item.rowIndex}, 'Trang_thai_tim_nha', this.value)">
                  <option value="Chưa tìm" ${item.Trang_thai_tim_nha === 'Chưa tìm' ? 'selected' : ''}>⚪ Chưa tìm</option>
                  <option value="Đã tới Ấp" ${item.Trang_thai_tim_nha === 'Đã tới Ấp' ? 'selected' : ''}>🟡 Đã tới Ấp</option>
                  <option value="Bỏ địa phương" ${item.Trang_thai_tim_nha === 'Bỏ địa phương' ? 'selected' : ''}>🔴 Bỏ địa phương</option>
                  <option value="Có người biết" ${item.Trang_thai_tim_nha === 'Có người biết' ? 'selected' : ''}>🔵 Có người biết</option>
                  <option value="Gặp người thân" ${item.Trang_thai_tim_nha === 'Gặp người thân' ? 'selected' : ''}>🟣 Gặp người thân</option>
                  <option value="Gặp khách hàng" ${item.Trang_thai_tim_nha === 'Gặp khách hàng' ? 'selected' : ''}>🟢 Gặp khách hàng</option>
                </select>
              </div>
            </div>

            <!-- Dòng 2: SĐT và Trạng thái HĐ / Độ khó -->
            <div class="row g-2 mb-2">
              <div class="col-12 text-secondary small">📞 SĐT: <b>${item.sdt || '---'}</b> | Kỳ: <b>${item.Thang || '---'}</b></div>
              
              <div class="col-6">
                <label class="small text-muted fw-bold mb-0">Trạng thái HĐ:</label>
                <select class="form-select form-select-sm" onchange="updateFieldAndNotify(${item.rowIndex}, 'Trang_thai_hd', this.value)">
                  <option value="Nợ" ${item.Trang_thai_hd === 'Nợ' ? 'selected' : ''}>🔴 Nợ</option>
                  <option value="Trả một phần" ${item.Trang_thai_hd === 'Trả một phần' ? 'selected' : ''}>🟡 Trả một phần</option>
                  <option value="Tất toán" ${item.Trang_thai_hd === 'Tất toán' ? 'selected' : ''}>🟢 Tất toán</option>
                  <option value="Hứa" ${item.Trang_thai_hd === 'Hứa' ? 'selected' : ''}>🔵 Hứa</option>
                </select>
              </div>

              <!-- Đã đem Độ khó lên vị trí cũ của Tìm nhà -->
              <div class="col-6">
                <label class="small text-muted fw-bold mb-0">Độ khó:</label>
                <select class="form-select form-select-sm" onchange="updateFieldAndNotify(${item.rowIndex}, 'Muc_do_kho', this.value)">
                  <option value="Chưa biết" ${item.Muc_do_kho === 'Chưa biết' ? 'selected' : ''}>⚪ Chưa biết</option>
                  <option value="Dễ làm việc" ${item.Muc_do_kho === 'Dễ làm việc' ? 'selected' : ''}>🟢 Dễ làm việc</option>
                  <option value="Trung lập" ${item.Muc_do_kho === 'Trung lập' ? 'selected' : ''}>🟡 Trung lập</option>
                  <option value="Khó Tính" ${item.Muc_do_kho === 'Khó Tính' ? 'selected' : ''}>🟠 Khó Tính</option>
                  <option value="Không hợp tác" ${item.Muc_do_kho === 'Không hợp tác' ? 'selected' : ''}>🔴 Không hợp tác</option>
                  <option value="Bạo lực" ${item.Muc_do_kho === 'Bạo lực' ? 'selected' : ''}>⛔ Bạo lực</option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
              <div>${gpsBadge}</div>
              <button class="btn btn-sm btn-outline-primary" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                🔽 Chi tiết & GPS
              </button>
            </div>

            <div class="collapse mt-3" id="${collapseId}">
              <div class="p-2 bg-light rounded border">
                
                <div class="mb-3">
                  <div class="small fw-bold mb-1">⚡ Xác thực thực địa:</div>
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm text-white flex-fill" style="background-color: #6f42c1;" onclick="doCheckAo(${item.rowIndex})">🛡️ Check Áo</button>
                    <button class="btn btn-sm btn-success flex-fill" onclick="doCheckGps(${item.rowIndex})">📍 Check GPS</button>
                  </div>
                </div>

                <!-- Địa chỉ -->
                <div class="sub-section mb-3 text-secondary small">
                  <b>📍 Địa chỉ:</b><br>
                  - Thường trú: ${item.WARD_HO_KHAU || '---'}<br>
                  - Tạm trú: ${item.WARD_TAM_TRU || '---'}<br>
                  - Shop: ${item.SHOPNAME || '---'}
                </div>

                <!-- Ghi chú và Liên hệ nằm trên GPS -->
                <div class="mb-3">
                  <label class="small fw-bold text-success">📝 Ghi chú:</label>
                  <div class="input-group input-group-sm mb-2">
                    <input type="text" id="note_${item.rowIndex}" class="form-control" value="${item.Ghi_chu || ''}">
                    <button class="btn btn-success" type="button" onclick="saveSubData(${item.rowIndex}, 'Ghi_chu', 'note_${item.rowIndex}', 'Đã lưu ghi chú!')">Lưu</button>
                  </div>

                  <label class="small fw-bold text-danger">👤 Người liên hệ:</label>
                  <div class="input-group input-group-sm">
                    <input type="text" id="contact_${item.rowIndex}" class="form-control" value="${item.Nguoi_lien_he || ''}">
                    <button class="btn btn-danger" type="button" onclick="saveSubData(${item.rowIndex}, 'Nguoi_lien_he', 'contact_${item.rowIndex}', 'Đã lưu liên hệ!')">Lưu</button>
                  </div>
                </div>

                <!-- Quản lý 5 GPS nằm dưới -->
                <div class="sub-section mb-3">
                  <div class="small fw-bold text-primary mb-1">🌐 Quản lý Tọa độ GPS:</div>
                  ${renderGpsInputsMobile(item)}
                </div>

              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function renderGpsInputsMobile(item) {
      let html = '';
      const gpsFields = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];
      const labels = ['Chính', 'GPS 1', 'GPS 2', 'GPS 3', 'GPS 4', 'GPS 5'];
      gpsFields.forEach((key, idx) => {
        html += `
          <div class="input-group input-group-sm mb-1">
            <span class="input-group-text" style="font-size:11px; width:65px;">${labels[idx]}</span>
            <input type="text" id="input_${item.rowIndex}_${key}" class="form-control" value="${item[key] || ''}" placeholder="Lat, Lng">
            <button class="btn btn-outline-secondary" type="button" onclick="getCurrentLocation(${item.rowIndex}, '${key}')">📍</button>
            <button class="btn btn-primary" type="button" onclick="saveGpsField(${item.rowIndex}, '${key}')">Lưu</button>
          </div>
        `;
      });
      return html;
    }

    async function doCheckGps(rowIndex) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async position => {
          const coordStr = `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`;
          const item = allRawData.find(d => d.rowIndex === rowIndex);
          if(!item) return;

          const gpsFields = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'];
          let targetKey = 'GPS_Chinh';
          
          for(let key of gpsFields) {
            if(!item[key] || String(item[key]).trim() === '') {
              targetKey = key;
              break;
            }
          }

          await updateField(rowIndex, targetKey, coordStr);
          await updateField(rowIndex, 'Check_GPS', 'Đã Check GPS');
          await updateField(rowIndex, 'Check_Ao', ''); 
          
          showToast(`Check GPS thành công vào [${targetKey}]: ${coordStr}`);
          loadCustomerData();
        }, () => showToast("Không thể lấy vị trí GPS!", "danger"));
      }
    }

    async function executeSync() {
      const targetMonth = document.getElementById("syncMonthSelect").value;
      bootstrap.Modal.getInstance(document.getElementById('syncModal')).hide();
      showToast("Đang đồng bộ dữ liệu...", "primary");
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "syncDataFromSheets", targetMonth: targetMonth })
        });
        const json = await res.json();
        showToast(json.message || "Đồng bộ hoàn tất!");
        loadCustomerData();
      } catch (err) {
        showToast("Lỗi đồng bộ!", "danger");
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => showToast(`Đã copy số HĐ: ${text}`, "success"));
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const bgClass = type === "success" ? "bg-success" : (type === "danger" ? "bg-danger" : "bg-primary");
      const toastId = "toast_" + Date.now();
      container.insertAdjacentHTML('beforeend', `
        <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0 shadow show mb-2">
          <div class="d-flex"><div class="toast-body fw-bold">${message}</div></div>
        </div>
      `);
      setTimeout(() => { const el = document.getElementById(toastId); if (el) el.remove(); }, 2500);
    }

    function resetFilters() {
      document.getElementById("filterMonth").value = "";
      document.getElementById("searchKeyword").value = "";
      document.getElementById("filterTrangThaiHd").value = "";
      document.getElementById("filterTimNha").value = "";
      document.getElementById("filterDoKho").value = "";
      document.getElementById("filterCheck").value = "";
      document.getElementById("filterHasGps").value = "";
      updateFilterCount();
      filterData();
    }

    async function doCheckAo(rowIndex) {
      await updateField(rowIndex, 'Check_Ao', 'Đã Check Áo');
      await updateField(rowIndex, 'Check_GPS', ''); 
      showToast("Đã Check Áo thành công!", "primary");
      loadCustomerData();
    }

    async function updateFieldAndNotify(rowIndex, fieldName, value) {
      await updateField(rowIndex, fieldName, value);
      showToast("Đã cập nhật trạng thái!");
    }

    async function updateField(rowIndex, fieldName, value) {
      const payload = { action: "updateCustomer", rowIndex: rowIndex, data: { [fieldName]: value } };
      await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    }

    async function saveSubData(rowIndex, fieldName, elementId, successMsg) {
      const val = document.getElementById(elementId).value;
      await updateField(rowIndex, fieldName, val);
      showToast(successMsg);
    }

    async function saveGpsField(rowIndex, key) {
      const val = document.getElementById(`input_${rowIndex}_${key}`).value;
      await updateField(rowIndex, key, val);
      showToast(`Đã lưu ${key}!`);
    }

    function getCurrentLocation(rowIndex, key) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const coordStr = `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`;
          document.getElementById(`input_${rowIndex}_${key}`).value = coordStr;
          updateField(rowIndex, key, coordStr);
          showToast(`Đã lấy vị trí: ${coordStr}`);
        });
      }
    }
  </script>
</body>
</html>
