<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thu Hồi Nợ - Mobile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f6f9; font-size: 15px; }
    .customer-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 12px; padding: 14px; border-left: 5px solid #0d6efd; }
    .row-check-ao { border-left-color: #6f42c1 !important; background-color: #fbf7ff !important; } 
    .row-check-gps { border-left-color: #198754 !important; background-color: #f2f9f4 !important; } 
    .sub-section { border-left: 3px solid #0d6efd; padding-left: 10px; margin-top: 8px; }
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; left: 20px; }
    #toast-container .toast { width: 100%; max-width: 100%; }
    
    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
    }
    .btn, .form-select, .form-control { min-height: 42px; }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="authOverlay">
    <div class="card p-4 shadow-lg text-center" style="max-width: 380px; width: 90%;">
      <h4 class="mb-3">🔐 BẢO MẬT HỆ THỐNG</h4>
      <input type="password" id="passInput" class="form-control mb-3 text-center fs-5" placeholder="Nhập mật khẩu..." onkeyup="if(event.key==='Enter') checkAuth()">
      <button class="btn btn-primary w-100 fw-bold" onclick="checkAuth()">XÁC NHẬN</button>
      <div id="authError" class="text-danger small mt-2 d-none">Mật khẩu không chính xác!</div>
    </div>
  </div>

  <div class="container py-3 px-2 d-none" id="mainContent">
    
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm flex-wrap gap-1">
      <h5 class="mb-0 fw-bold text-primary">📋 Thu Hồi Nợ</h5>
      <div class="d-flex gap-1">
        <button class="btn btn-warning btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#syncModal">🔄 Đồng bộ</button>
        <a href="map.html" class="btn btn-danger btn-sm fw-bold">🗺️ Bản đồ</a>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">🔒</button>
      </div>
    </div>

    <!-- BỘ ĐẾM -->
    <div class="card p-2 mb-2 bg-white shadow-sm text-center">
      <div class="row small fw-bold">
        <div class="col-6 border-end">🛡️ Tháng Này: <span id="countMonth" class="text-primary">0</span></div>
        <div class="col-6">📊 Tổng Check: <span id="countSuccess" class="text-success">0</span></div>
      </div>
    </div>

    <!-- TÌM KIẾM & NÚT LỌC GPS -->
    <div class="d-flex gap-2 mb-3">
      <button id="gpsFilterToggleBtn" class="btn btn-outline-danger fw-bold text-nowrap" onclick="toggleGpsFilterMode()">
        📍 Lọc GPS: TẮT
      </button>
      <div class="input-group shadow-sm">
        <input type="text" id="searchKeyword" class="form-control" placeholder="🔍 Tìm tên, số HĐ..." oninput="filterData()">
        <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterDrawer">
          ⚙️ Lọc (<span id="activeFilterCount">0</span>)
        </button>
      </div>
    </div>

    <div id="gpsFilterControlBox" class="card p-2 mb-3 bg-light border-danger d-none">
      <div class="row g-2">
        <div class="col-6">
          <label class="small fw-bold text-danger mb-1">📅 Kỳ tháng:</label>
          <select id="gpsFilterMonth" class="form-select form-select-sm" onchange="filterData()">
            <option value="">-- Tất cả tháng --</option>
          </select>
        </div>
        <div class="col-6">
          <label class="small fw-bold text-danger mb-1">🔍 Check:</label>
          <select id="gpsFilterCheckState" class="form-select form-select-sm" onchange="filterData()">
            <option value="">Tất cả</option>
            <option value="ChuaCheck">Chưa check</option>
            <option value="DaCheckGps">Đã Check GPS</option>
            <option value="DaCheckAo">Đã Check Áo</option>
          </select>
        </div>
      </div>
      <div class="text-center mt-2"><small class="text-muted" id="gpsStatusText">Đang định vị...</small></div>
    </div>

    <div id="customerCardContainer">
      <div class="text-center py-5 text-muted">Đang tải dữ liệu...</div>
    </div>
  </div>

  <!-- OFFCANVAS BỘ LỌC -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title">⚙️ Bộ Lọc Nâng Cao</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label class="form-label fw-bold small">Kỳ tháng:</label>
        <select id="filterMonth" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">-- Tất cả tháng --</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Khả Năng Thanh Toán:</label>
        <select id="filterTrangThaiHd" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Chưa biết">Chưa biết</option><option value="Ăn Giựt">Ăn Giựt</option><option value="Mất khả năng TT">Mất khả năng TT</option><option value="Đang kẹt tiền">Đang kẹt tiền</option><option value="Có khả năng">Có khả năng</option><option value="Hẹn Thanh Toán">Hẹn Thanh Toán</option><option value="Nhiều khả năng(Hẹn)">Nhiều khả năng(Hẹn)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">🏠 Lọc theo Thường Trú:</label>
        <input type="text" id="filterThuongTru" class="form-control" placeholder="Nhập tên xã, huyện..." oninput="filterData(); updateFilterCount();">
      </div>
      <button class="btn btn-outline-danger w-100 mt-2" onclick="resetFilters()">🔄 Đặt lại bộ lọc</button>
    </div>
  </div>

  <!-- MODAL ĐỒNG BỘ -->
  <div class="modal fade" id="syncModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">🔄 Trung Tâm Đồng Bộ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-bold small">Chọn kỳ tháng (Áp dụng cho đồng bộ khách hàng & địa chỉ):</label>
            <select id="syncMonthSelect" class="form-select">
              <option value="">⚡ Tất cả các tháng</option>
            </select>
          </div>
          <hr>
          <div class="d-grid gap-2">
            <button class="btn btn-primary fw-bold btn-sm py-2" onclick="executeSyncCustomers()">
              📥 Đồng bộ Khách Hàng (Theo Kỳ / Tất Cả)
            </button>
            <button class="btn btn-warning fw-bold btn-sm py-2 text-dark" onclick="executeSyncAddressOnly()">
              🏡 Đồng Bộ Địa Chỉ & Phân Loại Ấp
            </button>
            <button class="btn btn-success fw-bold btn-sm py-2" onclick="executeAssignGps()">
              📍 Gán Ngược GPS Từ Tab Ấp Vào Khách
            </button>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Đóng</button></div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyNt0upTCrxqOWgXsbZMW1PcpI01zJqbCLCw3cH09Vt7U33TBIBdyNb4RaIWwtLBRIB/exec"; 
    const AUTH_KEY = "app_auth_session"; const AUTH_PASS = "124985"; const ONE_DAY_MS = 24 * 60 * 60 * 1000;

    let allRawData = []; let isGpsFilterActive = false; let myCurrentCoords = null;

    window.onload = function() { checkSession(); };
    function checkSession() {
      try {
        const rawData = localStorage.getItem(AUTH_KEY);
        if (!rawData) { showLoginScreen(); return; }
        const authData = JSON.parse(rawData);
        if (authData.pass === AUTH_PASS && authData.expiry && new Date().getTime() < authData.expiry) {
          document.getElementById("authOverlay").style.display = "none";
          document.getElementById("mainContent").classList.remove("d-none");
          init();
        } else { showLoginScreen(); }
      } catch (e) { showLoginScreen(); }
    }
    function showLoginScreen() { document.getElementById("authOverlay").style.display = "flex"; document.getElementById("mainContent").classList.add("d-none"); }
    function checkAuth() {
      const inputEl = document.getElementById("passInput");
      if (inputEl.value.trim() === AUTH_PASS) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({ pass: AUTH_PASS, expiry: new Date().getTime() + ONE_DAY_MS }));
        checkSession();
      } else { document.getElementById("authError").classList.remove("d-none"); inputEl.value = ""; }
    }
    function logout() { localStorage.removeItem(AUTH_KEY); location.reload(); }

    async function init() {
      try {
        const res = await fetch(`${API_URL}?action=getMonths`);
        const json = await res.json();
        const filterSel = document.getElementById("filterMonth");
        const gpsMonthSel = document.getElementById("gpsFilterMonth");
        const syncSel = document.getElementById("syncMonthSelect");
        
        // Tự động tạo định dạng mmyyyy cho tháng hiện tại
        const now = new Date();
        const currentMmyyyy = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();

        if(json.months) {
          json.months.forEach(m => {
            if(filterSel) filterSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
            if(gpsMonthSel) gpsMonthSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
            if(syncSel) syncSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
          });
        }

        // Mặc định chọn tháng hiện tại theo chuẩn mmyyyy nếu có trong danh sách
        if(filterSel) filterSel.value = currentMmyyyy;
        if(gpsMonthSel) gpsMonthSel.value = currentMmyyyy;

        loadCustomerData();
      } catch(err) { console.error(err); }
    }

    async function loadCustomerData() {
      const res = await fetch(`${API_URL}?action=getData`);
      const json = await res.json();
      allRawData = json.data || [];
      filterData();
      updateCounters(allRawData);
    }

    function toggleGpsFilterMode() {
      isGpsFilterActive = !isGpsFilterActive;
      const btn = document.getElementById("gpsFilterToggleBtn");
      const box = document.getElementById("gpsFilterControlBox");
      if (isGpsFilterActive) {
        btn.className = "btn btn-danger fw-bold text-nowrap"; btn.innerText = "📍 Lọc GPS: BẬT"; box.classList.remove("d-none");
        navigator.geolocation.getCurrentPosition(pos => { myCurrentCoords = {lat: pos.coords.latitude, lng: pos.coords.longitude}; filterData(); }, () => {});
      } else {
        btn.className = "btn btn-outline-danger fw-bold text-nowrap"; btn.innerText = "📍 Lọc GPS: TẮT"; box.classList.add("d-none"); filterData();
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function updateCounters(data) {
      let total = 0; let monthC = 0;
      const now = new Date();
      const currentMonthStr = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();
      data.forEach(item => {
        if (item.Check_GPS === 'Đã Check GPS' || item.Check_Ao === 'Đã Check Áo') {
          total++; if (String(item.Thang).trim() === currentMonthStr) monthC++;
        }
      });
      document.getElementById("countSuccess").innerText = total; document.getElementById("countMonth").innerText = monthC;
    }

    function updateFilterCount() {
      let count = 0;
      if(document.getElementById("filterMonth").value) count++;
      if(document.getElementById("filterTrangThaiHd").value) count++;
      if(document.getElementById("filterThuongTru").value) count++;
      document.getElementById("activeFilterCount").innerText = count;
    }

    function filterData() {
      let filtered = [];
      const gpsKeys = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5', 'GPS_AP_NEW', 'GPS_AP_OLD'];

      if (isGpsFilterActive) {
        const monthVal = document.getElementById("gpsFilterMonth").value;
        const checkState = document.getElementById("gpsFilterCheckState").value;
        const keyword = document.getElementById("searchKeyword").value.toLowerCase();

        filtered = allRawData.map(item => {
          if (monthVal && String(item.Thang).trim() !== String(monthVal).trim()) return null;
          if (keyword && !`${item.Ten_khach_hang || ''} ${item.so_hd || ''}`.toLowerCase().includes(keyword)) return null;
          if (checkState === 'DaCheckGps' && item.Check_GPS !== 'Đã Check GPS') return null;
          if (checkState === 'DaCheckAo' && item.Check_Ao !== 'Đã Check Áo') return null;
          if (checkState === 'ChuaCheck' && (item.Check_GPS === 'Đã Check GPS' || item.Check_Ao === 'Đã Check Áo')) return null;

          let minDist = Infinity;
          if (myCurrentCoords) {
            gpsKeys.forEach(k => {
              if (item[k] && String(item[k]).includes(',')) {
                let p = item[k].split(',');
                let d = calculateDistance(myCurrentCoords.lat, myCurrentCoords.lng, parseFloat(p[0]), parseFloat(p[1]));
                if (d < minDist) minDist = d;
              }
            });
          }
          if (minDist === Infinity) return null;
          return { ...item, _nearestDist: minDist };
        }).filter(Boolean);
        filtered.sort((a, b) => a._nearestDist - b._nearestDist);
      } else {
        const monthVal = document.getElementById("filterMonth").value;
        const keyword = document.getElementById("searchKeyword").value.toLowerCase();
        const fTrangThai = document.getElementById("filterTrangThaiHd").value;
        const fThuongTru = document.getElementById("filterThuongTru").value.toLowerCase();

        filtered = allRawData.filter(item => {
          if (monthVal && String(item.Thang).trim() !== String(monthVal).trim()) return false;
          if (keyword && !`${item.Ten_khach_hang || ''} ${item.so_hd || ''}`.toLowerCase().includes(keyword)) return false;
          if (fTrangThai && item.Trang_thai_hd !== fTrangThai) return false;
          if (fThuongTru && !`${item.WARD_HO_KHAU || ''} ${item.WARD_HO_KHAU_AP_NEW || ''} ${item.WARD_HO_KHAU_AP_OLD || ''}`.toLowerCase().includes(fThuongTru)) return false;
          return true;
        });
      }
      renderCards(filtered);
    }

    function renderCards(data) {
      const container = document.getElementById("customerCardContainer");
      if(data.length === 0) { container.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Không tìm thấy khách hàng.</div>`; return; }

      container.innerHTML = data.map((item, idx) => {
        let cardStyleClass = item.Check_GPS === 'Đã Check GPS' ? 'row-check-gps' : (item.Check_Ao === 'Đã Check Áo' ? 'row-check-ao' : '');
        let distBadge = (isGpsFilterActive && item._nearestDist !== undefined) ? `<span class="badge bg-danger ms-1">📍 ${item._nearestDist.toFixed(2)} km</span>` : '';
        let collapseId = `collapseCard_${idx}`;
        let paidStr = item.So_tien_thanh_toan ? Number(item.So_tien_thanh_toan).toLocaleString() + ' VNĐ' : 'Chưa';

        return `
          <div class="customer-card ${cardStyleClass}">
            <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
              <div>
                <h6 class="fw-bold text-primary mb-1">${item.Ten_khach_hang || 'Chưa có tên'} ${distBadge}</h6>
                <small class="text-muted">HĐ: <code>${item.so_hd || ''}</code></small>
                <button class="btn btn-sm btn-link p-0 ms-1" onclick="copyToClipboard('${item.so_hd}')">📋</button>
              </div>
              <div style="width: 135px;">
                <select class="form-select form-select-sm fw-bold border-primary" onchange="updateFieldAndNotify(${item.rowIndex}, 'Trang_thai_tim_nha', this.value)">
                  <option value="Chưa tìm" ${item.Trang_thai_tim_nha === 'Chưa tìm' ? 'selected' : ''}>⚪ Chưa tìm</option>
                  <option value="Đã tới Ấp" ${item.Trang_thai_tim_nha === 'Đã tới Ấp' ? 'selected' : ''}>🟡 Đã tới Ấp</option>
                  <option value="Bỏ địa phương" ${item.Trang_thai_tim_nha === 'Bỏ địa phương' ? 'selected' : ''}>🔴 Bỏ địa phương</option>
                  <option value="Có người biết" ${item.Trang_thai_tim_nha === 'Có người biết' ? 'selected' : ''}>🔵 Có người biết</option>
                  <option value="Gặp người thân" ${item.Trang_thai_tim_nha === 'Gặp người thân' ? 'selected' : ''}>🟣 Gặp người thân</option>
                  <option value="Gặp khách hàng" ${item.Trang_thai_tim_nha === 'Gặp khách hàng' ? 'selected' : ''}>🟢 Gặp khách hàng</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-12 text-secondary small">📞 SĐT: <b>${item.sdt || '---'}</b> | Kỳ: <b>${item.Thang || '---'}</b></div>
              <div class="col-6">
                <label class="small text-muted fw-bold mb-0">Khả Năng Thanh Toán:</label>
                <select class="form-select form-select-sm" onchange="updateFieldAndNotify(${item.rowIndex}, 'Trang_thai_hd', this.value)">
                  <option value="Chưa biết" ${item.Trang_thai_hd === 'Chưa biết' ? 'selected' : ''}>⚪ Chưa biết</option>
                  <option value="Ăn Giựt" ${item.Trang_thai_hd === 'Ăn Giựt' ? 'selected' : ''}>⛔ Ăn Giựt</option>
                  <option value="Mất khả năng TT" ${item.Trang_thai_hd === 'Mất khả năng TT' ? 'selected' : ''}>🔴 Mất khả năng TT</option>
                  <option value="Đang kẹt tiền" ${item.Trang_thai_hd === 'Đang kẹt tiền' ? 'selected' : ''}>🟠 Đang kẹt tiền</option>
                  <option value="Có khả năng" ${item.Trang_thai_hd === 'Có khả năng' ? 'selected' : ''}>🟢 Có khả năng</option>
                  <option value="Hẹn Thanh Toán" ${item.Trang_thai_hd === 'Hẹn Thanh Toán' ? 'selected' : ''}>🔵 Hẹn Thanh Toán</option>
                  <option value="Nhiều khả năng(Hẹn)" ${item.Trang_thai_hd === 'Nhiều khả năng(Hẹn)' ? 'selected' : ''}>🟣 Nhiều khả năng(Hẹn)</option>
                </select>
              </div>
              <div class="col-6">
                <label class="small text-muted fw-bold mb-0">Độ khó:</label>
                <select class="form-select form-select-sm" onchange="updateFieldAndNotify(${item.rowIndex}, 'Muc_do_kho', this.value)">
                  <option value="Chưa biết" ${item.Muc_do_kho === 'Chưa biết' ? 'selected' : ''}>⚪ Chưa biết</option>
                  <option value="Dễ làm việc" ${item.Muc_do_kho === 'Dễ làm việc' ? 'selected' : ''}>🟢 Dễ làm việc</option>
                  <option value="Trung lập" ${item.Muc_do_kho === 'Trung lập' ? 'selected' : ''}>🟡 Trung lập</option>
                  <option value="Khó Tính" ${item.Muc_do_kho === 'Khó Tính' ? 'selected' : ''}>🟠 Khó Tính</option>
                  <option value="Không hợp tác" ${item.Muc_do_kho === 'Không hợp tác' ? 'selected' : ''}>🔴 Không hợp tác</option>
                  <option value="Bạo lực" ${item.Muc_do_kho === 'Bạo lực' ? 'selected' : ''}>⛔ Bạo lực</option>
                </select>
              </div>
            </div>

            <div class="sub-section mb-2 text-secondary small">
              <b>📍 Địa chỉ gốc:</b> ${item.WARD_HO_KHAU || '---'}<br>
              <div class="mt-1">
                <b class="text-dark">📍 Ấp New:</b> <span id="text_new_${item.rowIndex}">${item.WARD_HO_KHAU_AP_NEW || '<i>Chưa có</i>'}</span>
                <button class="btn btn-sm p-0 ms-1 text-primary" onclick="toggleEdit('${item.rowIndex}', 'apnew')">✏️</button>
                <div id="box_apnew_${item.rowIndex}" class="d-none mt-1">
                  <div class="input-group input-group-sm">
                    <input type="text" id="input_apnew_${item.rowIndex}" class="form-control" value="${item.WARD_HO_KHAU_AP_NEW || ''}">
                    <button class="btn btn-success" onclick="saveInlineEdit('${item.rowIndex}', 'WARD_HO_KHAU_AP_NEW', 'input_apnew_${item.rowIndex}', 'apnew')">Lưu</button>
                    <button class="btn btn-secondary" onclick="toggleEdit('${item.rowIndex}', 'apnew')">Hủy</button>
                  </div>
                </div>
              </div>
              <div class="mt-1">
                <b class="text-dark">📍 Ấp Old:</b> <span id="text_old_${item.rowIndex}">${item.WARD_HO_KHAU_AP_OLD || '<i>Chưa có</i>'}</span>
                <button class="btn btn-sm p-0 ms-1 text-primary" onclick="toggleEdit('${item.rowIndex}', 'apold')">✏️</button>
                <div id="box_apold_${item.rowIndex}" class="d-none mt-1">
                  <div class="input-group input-group-sm">
                    <input type="text" id="input_apold_${item.rowIndex}" class="form-control" value="${item.WARD_HO_KHAU_AP_OLD || ''}">
                    <button class="btn btn-success" onclick="saveInlineEdit('${item.rowIndex}', 'WARD_HO_KHAU_AP_OLD', 'input_apold_${item.rowIndex}', 'apold')">Lưu</button>
                    <button class="btn btn-secondary" onclick="toggleEdit('${item.rowIndex}', 'apold')">Hủy</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="my-2 pt-2 border-top small">
              <div class="mb-1">
                <span class="fw-bold text-success">📝 Ghi chú:</span> <span id="text_note_${item.rowIndex}">${item.Ghi_chu || '<i>Chưa có</i>'}</span>
                <button class="btn btn-sm p-0 ms-1 text-primary" onclick="toggleEdit('${item.rowIndex}', 'note')">✏️</button>
                <div id="box_note_${item.rowIndex}" class="d-none mt-1">
                  <div class="input-group input-group-sm">
                    <input type="text" id="input_note_${item.rowIndex}" class="form-control" value="${item.Ghi_chu || ''}">
                    <button class="btn btn-success" onclick="saveInlineEdit('${item.rowIndex}', 'Ghi_chu', 'input_note_${item.rowIndex}', 'note')">Lưu</button>
                    <button class="btn btn-secondary" onclick="toggleEdit('${item.rowIndex}', 'note')">Hủy</button>
                  </div>
                </div>
              </div>

              <div class="mb-1">
                <span class="fw-bold text-danger">👤 Liên hệ:</span> <span id="text_contact_${item.rowIndex}">${item.Nguoi_lien_he || '<i>Chưa có</i>'}</span>
                <button class="btn btn-sm p-0 ms-1 text-primary" onclick="toggleEdit('${item.rowIndex}', 'contact')">✏️</button>
                <div id="box_contact_${item.rowIndex}" class="d-none mt-1">
                  <div class="input-group input-group-sm">
                    <input type="text" id="input_contact_${item.rowIndex}" class="form-control" value="${item.Nguoi_lien_he || ''}">
                    <button class="btn btn-danger" onclick="saveInlineEdit('${item.rowIndex}', 'Nguoi_lien_he', 'input_contact_${item.rowIndex}', 'contact')">Lưu</button>
                    <button class="btn btn-secondary" onclick="toggleEdit('${item.rowIndex}', 'contact')">Hủy</button>
                  </div>
                </div>
              </div>

              <div>
                <span class="fw-bold text-success">💰 Đã TT:</span> <span id="text_paid_${item.rowIndex}" class="fw-bold text-dark">${paidStr}</span>
                <button class="btn btn-sm p-0 ms-1 text-primary" onclick="toggleEdit('${item.rowIndex}', 'paid')">✏️</button>
                <div id="box_paid_${item.rowIndex}" class="d-none mt-1">
                  <div class="input-group input-group-sm">
                    <input type="number" id="input_paid_${item.rowIndex}" class="form-control" value="${item.So_tien_thanh_toan || ''}">
                    <button class="btn btn-success" onclick="savePaidAmountInline('${item.rowIndex}')">Lưu</button>
                    <button class="btn btn-secondary" onclick="toggleEdit('${item.rowIndex}', 'paid')">Hủy</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
              <div><span class="badge bg-primary">GPS Quản lý (8 Điểm)</span></div>
              <button class="btn btn-sm btn-outline-primary" type="button">🔽 Thao tác Check & GPS</button>
            </div>

            <div class="collapse mt-2" id="${collapseId}">
              <div class="p-2 bg-light rounded border">
                <div class="mb-3">
                  <div class="small fw-bold mb-1">⚡ Xác thực thực địa:</div>
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm text-white flex-fill" style="background-color: #6f42c1;" onclick="doCheckAo(${item.rowIndex})">🛡️ Check Áo</button>
                    <button class="btn btn-sm btn-success flex-fill" onclick="doCheckGps(${item.rowIndex})">📍 Check GPS</button>
                  </div>
                </div>
                <div class="sub-section">
                  <div class="small fw-bold text-primary mb-1">🌐 Tọa độ GPS & Ấp:</div>
                  ${renderGpsInputsMobile(item)}
                </div>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function renderGpsInputsMobile(item) {
      let html = '';
      const gpsFields = ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5', 'GPS_AP_NEW', 'GPS_AP_OLD'];
      const labels = ['Chính', 'GPS 1', 'GPS 2', 'GPS 3', 'GPS 4', 'GPS 5', 'GPS New', 'GPS Old'];
      
      gpsFields.forEach((key, idx) => {
        const val = item[key] || '';
        const hasData = val.includes(',');
        const mapBtnStyle = hasData ? 'btn-danger' : 'btn-outline-secondary disabled';
        const mapUrl = hasData ? `https://www.google.com/maps?q=${val}` : '#';

        html += `
          <div class="input-group input-group-sm mb-1">
            <span class="input-group-text" style="font-size:11px; width:75px;">${labels[idx]}</span>
            <input type="text" id="input_${item.rowIndex}_${key}" class="form-control" value="${val}" placeholder="Lat, Lng">
            <button class="btn btn-outline-secondary" type="button" onclick="getCurrentLocation(${item.rowIndex}, '${key}')">📍</button>
            <button class="btn btn-primary" type="button" onclick="saveGpsField(${item.rowIndex}, '${key}')">Lưu</button>
            <a href="${mapUrl}" target="_blank" class="btn ${mapBtnStyle}">🗺️</a>
          </div>
        `;
      });
      return html;
    }

    function toggleEdit(rowIndex, type) { document.getElementById(`box_${type}_${rowIndex}`).classList.toggle('d-none'); }
    
    async function saveInlineEdit(rowIndex, fieldName, inputId, type) {
      const val = document.getElementById(inputId).value.trim();
      toggleEdit(rowIndex, type);
      const item = allRawData.find(d => d.rowIndex == rowIndex);
      if (item) item[fieldName] = val;
      document.getElementById(`text_${type}_${rowIndex}`).innerHTML = val || '<i>Chưa có</i>';
      await updateField(rowIndex, fieldName, val);
      showToast("Đã cập nhật!");
    }

    async function savePaidAmountInline(rowIndex) {
      const val = document.getElementById(`input_paid_${rowIndex}`).value;
      toggleEdit(rowIndex, 'paid');
      const item = allRawData.find(d => d.rowIndex == rowIndex);
      if (item) item.So_tien_thanh_toan = val;
      document.getElementById(`text_paid_${rowIndex}`).innerText = val ? Number(val).toLocaleString() + ' VNĐ' : 'Chưa';
      await updateField(rowIndex, 'So_tien_thanh_toan', val);
      showToast("Đã lưu số tiền thanh toán!");
    }

    async function executeSyncCustomers() {
      const targetMonth = document.getElementById("syncMonthSelect").value;
      showToast("Đang đồng bộ thông tin khách hàng...", "primary");
      const res = await fetch(API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "syncDataFromSheets", targetMonth: targetMonth }) 
      });
      const json = await res.json();
      showToast(json.message); 
      loadCustomerData();
    }

    async function executeSyncAddressOnly() {
      const targetMonth = document.getElementById("syncMonthSelect").value;
      showToast("Đang quét địa chỉ và phân loại vào tab Ấp...", "primary");
      const res = await fetch(API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "syncAddressToApTabs", targetMonth: targetMonth }) 
      });
      const json = await res.json();
      showToast(json.message);
    }

    async function executeAssignGps() {
      showToast("Đang gán ngược GPS từ tab Ấp...", "primary");
      const res = await fetch(API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "assignGpsFromApTabs" }) 
      });
      const json = await res.json();
      showToast(json.message); 
      loadCustomerData();
    }

    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => showToast(`Đã copy: ${text}`)); }
    function showToast(msg, type = "success") {
      const c = document.getElementById("toast-container");
      const id = "toast_" + Date.now();
      c.insertAdjacentHTML('beforeend', `<div id="${id}" class="toast align-items-center text-white bg-${type === 'danger' ? 'danger' : 'success'} border-0 shadow show mb-2"><div class="d-flex"><div class="toast-body fw-bold">${msg}</div></div></div>`);
      setTimeout(() => document.getElementById(id)?.remove(), 2500);
    }
    function resetFilters() {
      document.getElementById("filterMonth").value = ""; document.getElementById("searchKeyword").value = "";
      document.getElementById("filterTrangThaiHd").value = ""; document.getElementById("filterThuongTru").value = "";
      updateFilterCount(); filterData();
    }
    async function updateFieldAndNotify(r, f, v) { await updateField(r, f, v); showToast("Đã cập nhật!"); }
    async function updateField(r, f, v) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateCustomer", rowIndex: r, data: { [f]: v } }) }); }
    async function saveGpsField(r, k) { await updateField(r, k, document.getElementById(`input_${r}_${k}`).value); showToast(`Đã lưu ${k}!`); }
    function getCurrentLocation(r, k) {
      navigator.geolocation.getCurrentPosition(pos => {
        const c = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
        document.getElementById(`input_${r}_${k}`).value = c; updateField(r, k, c); showToast(`Đã lấy vị trí ${k}!`);
      });
    }
  </script>
</body>
</html>
