<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thu Hồi Nợ - Mobile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f6f9; font-size: 15px; }
    .customer-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 12px; padding: 14px; border-left: 5px solid #0d6efd; }
    .row-check-ao { border-left-color: #6f42c1 !important; background-color: #fbf7ff !important; } 
    .row-check-gps { border-left-color: #198754 !important; background-color: #f2f9f4 !important; } 
    .sub-section { border-left: 3px solid #0d6efd; padding-left: 10px; margin-top: 8px; }
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; left: 20px; }
    #toast-container .toast { width: 100%; max-width: 100%; }
    #authOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .btn, .form-select, .form-control { min-height: 42px; }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="authOverlay">
    <div class="card p-4 shadow-lg text-center" style="max-width: 380px; width: 90%;">
      <h4 class="mb-3">🔐 BẢO MẬT HỆ THỐNG</h4>
      <input type="password" id="passInput" class="form-control mb-3 text-center fs-5" placeholder="Nhập mật khẩu..." onkeyup="if(event.key==='Enter') checkAuth()">
      <button class="btn btn-primary w-100 fw-bold" onclick="checkAuth()">XÁC NHẬN</button>
      <div id="authError" class="text-danger small mt-2 d-none">Mật khẩu không chính xác!</div>
    </div>
  </div>

  <div class="container py-3 px-2 d-none" id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm flex-wrap gap-1">
      <h5 class="mb-0 fw-bold text-primary">📋 Thu Hồi Nợ</h5>
      <div class="d-flex gap-1">
        <a href="ap.html" class="btn btn-warning btn-sm fw-bold">🏡 Quản Lý Ấp</a>
        <a href="map.html" class="btn btn-danger btn-sm fw-bold">🗺️ Bản đồ</a>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">🔒</button>
      </div>
    </div>

    <!-- BỘ ĐẾM THỐNG KÊ -->
    <div class="card p-2 mb-2 bg-white shadow-sm text-center">
      <div class="row small fw-bold">
        <div class="col-6 border-end">🛡️ Kỳ Tháng: <span id="countMonth" class="text-primary">0</span></div>
        <div class="col-6">📊 Tổng Lượt Check: <span id="countSuccess" class="text-success">0</span></div>
      </div>
    </div>

    <!-- TÌM KIẾM & NÚT LỌC GPS -->
    <div class="d-flex gap-2 mb-3">
      <button id="gpsFilterToggleBtn" class="btn btn-outline-danger fw-bold text-nowrap" onclick="toggleGpsFilterMode()">
        📍 Lọc GPS: TẮT
      </button>
      <div class="input-group shadow-sm">
        <input type="text" id="searchKeyword" class="form-control" placeholder="🔍 Tìm tên, số HĐ..." oninput="filterData()">
        <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterDrawer">
          ⚙️ Lọc (<span id="activeFilterCount">0</span>)
        </button>
      </div>
    </div>

    <div id="gpsFilterControlBox" class="card p-2 mb-3 bg-light border-danger d-none">
      <div class="row g-2">
        <div class="col-6">
          <label class="small fw-bold text-danger mb-1">📅 Kỳ tháng:</label>
          <select id="gpsFilterMonth" class="form-select form-select-sm" onchange="loadCustomerData()"></select>
        </div>
        <div class="col-6">
          <label class="small fw-bold text-danger mb-1">🔍 Check:</label>
          <select id="gpsFilterCheckState" class="form-select form-select-sm fw-bold text-danger" onchange="filterData()">
            <option value="ChuaCheck" selected>🔴 Chưa check</option>
            <option value="DaCheckGps">🟢 Đã Check GPS</option>
            <option value="DaCheckAo">🟣 Đã Check Áo</option>
            <option value="">⚡ Tất cả</option>
          </select>
        </div>
      </div>
    </div>

    <div id="customerCardContainer">
      <div class="text-center py-5 text-muted">Đang tải dữ liệu...</div>
    </div>
  </div>

  <!-- OFFCANVAS BỘ LỌC ĐẦY ĐỦ -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title">⚙️ Bộ Lọc Nâng Cao</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label class="form-label fw-bold small">Kỳ tháng:</label>
        <select id="filterMonth" class="form-select" onchange="loadCustomerData(); updateFilterCount();"></select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng Thái Check:</label>
        <select id="filterCheck" class="form-select fw-bold text-danger" onchange="filterData(); updateFilterCount();">
          <option value="ChuaCheck" selected>🔴 Chưa check</option>
          <option value="DaCheckGps">🟢 Đã Check GPS</option>
          <option value="DaCheckAo">🟣 Đã Check Áo</option>
          <option value="">⚡ Tất cả</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng Thái Thanh Toán:</label>
        <select id="filterThanhToan" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="chua_thanh_toan" selected>Chưa thanh toán (Dưới 500k)</option>
          <option value="da_thanh_toan_tren_500k">Đã thanh toán trên 500.000</option>
        </select>
      </div>
      <button class="btn btn-outline-danger w-100 mt-2" onclick="resetFilters()">🔄 Đặt lại bộ lọc</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwUE4uo5kihhrficlHTWtTeUDNy0n-vo49osANuoD17KzkueUzABRxUVgKzIwza-AW9/exec "; 
    const AUTH_KEY = "app_auth_session"; const AUTH_PASS = "124985"; const ONE_DAY_MS = 24 * 60 * 60 * 1000;

    let allRawData = []; let isGpsFilterActive = false; let myCurrentCoords = null;

    window.onload = function() { checkSession(); };
    function checkSession() {
      try {
        const rawData = localStorage.getItem(AUTH_KEY);
        if (!rawData) { showLoginScreen(); return; }
        const authData = JSON.parse(rawData);
        if (authData.pass === AUTH_PASS && authData.expiry && new Date().getTime() < authData.expiry) {
          document.getElementById("authOverlay").style.display = "none";
          document.getElementById("mainContent").classList.remove("d-none");
          init();
        } else { showLoginScreen(); }
      } catch (e) { showLoginScreen(); }
    }
    function showLoginScreen() { document.getElementById("authOverlay").style.display = "flex"; document.getElementById("mainContent").classList.add("d-none"); }
    function checkAuth() {
      const inputEl = document.getElementById("passInput");
      if (inputEl.value.trim() === AUTH_PASS) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({ pass: AUTH_PASS, expiry: new Date().getTime() + ONE_DAY_MS }));
        checkSession();
      } else { document.getElementById("authError").classList.remove("d-none"); inputEl.value = ""; }
    }
    function logout() { localStorage.removeItem(AUTH_KEY); location.reload(); }

    async function init() {
      try {
        const res = await fetch(`${API_URL}?action=getMonths`);
        const json = await res.json();
        const filterSel = document.getElementById("filterMonth");
        const gpsMonthSel = document.getElementById("gpsFilterMonth");
        
        const now = new Date();
        const currentMmyyyy = String(now.getMonth() + 1).padStart(2, '0') + now.getFullYear();

        if(json.months) {
          json.months.forEach(m => {
            if (m !== 'ap_new' && m !== 'ap_old') {
              if(filterSel) filterSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
              if(gpsMonthSel) gpsMonthSel.innerHTML += `<option value="${m}">Kỳ ${m}</option>`;
            }
          });
        }

        if(filterSel) filterSel.value = currentMmyyyy;
        if(gpsMonthSel) gpsMonthSel.value = currentMmyyyy;

        loadCustomerData();
      } catch(err) { console.error(err); }
    }

    async function loadCustomerData() {
      const currentMonth = document.getElementById("filterMonth").value || document.getElementById("gpsFilterMonth").value;
      const res = await fetch(`${API_URL}?action=getData&month=${currentMonth}`);
      const json = await res.json();
      allRawData = json.data || [];
      filterData();
      updateCounters(allRawData);
    }

    function toggleGpsFilterMode() {
      isGpsFilterActive = !isGpsFilterActive;
      const btn = document.getElementById("gpsFilterToggleBtn");
      const box = document.getElementById("gpsFilterControlBox");
      if (isGpsFilterActive) {
        btn.className = "btn btn-danger fw-bold text-nowrap"; btn.innerText = "📍 Lọc GPS: BẬT"; box.classList.remove("d-none");
        navigator.geolocation.getCurrentPosition(pos => { myCurrentCoords = {lat: pos.coords.latitude, lng: pos.coords.longitude}; filterData(); }, () => {});
      } else {
        btn.className = "btn btn-outline-danger fw-bold text-nowrap"; btn.innerText = "📍 Lọc GPS: TẮT"; box.classList.add("d-none"); filterData();
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function parseGpsCoord(rawStr) {
      if (!rawStr || typeof rawStr !== 'string') return null;
      let parts = rawStr.split(',').map(s => parseFloat(s.trim()));
      if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) return { lat: parts[0], lng: parts[1] };
      return null;
    }

    function updateCounters(data) {
      let totalCheck = 0;
      data.forEach(item => { totalCheck += Number(item.So_lan_check) || 0; });
      document.getElementById("countSuccess").innerText = totalCheck; 
      document.getElementById("countMonth").innerText = document.getElementById("filterMonth").value;
    }

    function updateFilterCount() {
      let count = 0;
      if(document.getElementById("filterThanhToan").value !== "chua_thanh_toan") count++;
      if(document.getElementById("filterCheck").value !== "ChuaCheck") count++;
      document.getElementById("activeFilterCount").innerText = count;
    }

    function filterData() {
      const fThanhToan = document.getElementById("filterThanhToan").value;
      const keyword = document.getElementById("searchKeyword").value.toLowerCase();
      const fCheck = document.getElementById("filterCheck").value;

      let filtered = allRawData.filter(item => {
        let soHdStr = String(item.so_hd || item['số hđ'] || '').toLowerCase();
        let tenKhStr = String(item.Ten_khach_hang || '').toLowerCase();
        if (keyword && !tenKhStr.includes(keyword) && !soHdStr.includes(keyword)) return false;
        
        const paidAmount = Number(item.So_tien_thanh_toan) || 0;
        if (fThanhToan === 'chua_thanh_toan' && paidAmount >= 500000) return false;
        if (fThanhToan === 'da_thanh_toan_tren_500k' && paidAmount < 500000) return false;

        const isChecked = (item.Check_GPS === 'Đã Check GPS' || item.Check_Ao === 'Đã Check Áo' || (Number(item.So_lan_check) || 0) > 0);
        if (fCheck === 'DaCheckGps' && item.Check_GPS !== 'Đã Check GPS') return false;
        if (fCheck === 'DaCheckAo' && item.Check_Ao !== 'Đã Check Áo') return false;
        if (fCheck === 'ChuaCheck' && isChecked) return false;

        return true;
      });

      if (isGpsFilterActive && myCurrentCoords) {
        filtered = filtered.map(item => {
          let minDist = Infinity;
          ['GPS_Chinh', 'GPS_1', 'GPS_2', 'GPS_3', 'GPS_4', 'GPS_5'].forEach(k => {
            let coord = parseGpsCoord(item[k]);
            if (coord) {
              let d = calculateDistance(myCurrentCoords.lat, myCurrentCoords.lng, coord.lat, coord.lng);
              if (d < minDist) minDist = d;
            }
          });
          return { ...item, _nearestDist: minDist };
        }).filter(item => item._nearestDist !== Infinity);
        filtered.sort((a, b) => a._nearestDist - b._nearestDist);
      }

      renderCards(filtered);
    }

    function renderCards(data) {
      const container = document.getElementById("customerCardContainer");
      if(data.length === 0) { container.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Không tìm thấy khách hàng.</div>`; return; }

      container.innerHTML = data.map((item, idx) => {
        let cardStyleClass = item.Check_GPS === 'Đã Check GPS' ? 'row-check-gps' : (item.Check_Ao === 'Đã Check Áo' ? 'row-check-ao' : '');
        let soHdVal = item.so_hd || item['số hđ'] || '';
        let paidStr = item.So_tien_thanh_toan ? Number(item.So_tien_thanh_toan).toLocaleString() + ' VNĐ' : 'Chưa';
        let ngayQuaHan = item.Ngay_qua_han !== undefined ? item.Ngay_qua_han : '---';
        let checkCount = Number(item.So_lan_check) || 0;

        return `
          <div class="customer-card ${cardStyleClass}">
            <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
              <div>
                <h6 class="fw-bold text-primary mb-1">${item.Ten_khach_hang || 'Chưa có tên'}</h6>
                <small class="text-muted">HĐ: <code>${soHdVal}</code></small>
                <button class="btn btn-sm btn-link p-0 ms-1" onclick="copyToClipboard('${soHdVal}')">📋</button>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-12 text-secondary small">
                📞 SĐT: <b>${item.sdt || '---'}</b><br>
                ⏰ Quá hạn: <b class="text-danger">${ngayQuaHan} ngày</b> | 📊 Lượt check tháng này: <b class="text-success">${checkCount} lần</b>
              </div>
            </div>

            <div class="my-2 pt-2 border-top small">
              <div>
                <span class="fw-bold text-success">💰 Đã TT (Tháng này):</span> <span class="fw-bold text-dark">${paidStr}</span>
                <button class="btn btn-sm btn-outline-primary py-0 ms-2" onclick="promptUpdatePayment(${item.rowIndex})">✏️ Nhập tiền</button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
              <div class="d-flex gap-2 w-100">
                <button class="btn btn-sm text-white flex-fill" style="background-color: #6f42c1;" onclick="doCheck(${item.rowIndex}, 'AO')">🛡️ Check Áo</button>
                <button class="btn btn-sm btn-success flex-fill" onclick="doCheck(${item.rowIndex}, 'GPS')">📍 Check GPS</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function doCheck(rowIndex, type) {
      const currentMonth = document.getElementById("filterMonth").value;
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "recordCheckMonth", rowIndex: rowIndex, monthTab: currentMonth, type: type })
      });
      showToast(`Đã ghi nhận Check ${type === 'GPS' ? 'GPS' : 'Áo'} vào kỳ ${currentMonth}!`);
      loadCustomerData();
    }

    async function promptUpdatePayment(rowIndex) {
      let val = prompt("Nhập số tiền khách hàng đã thanh toán trong tháng này:");
      if (val !== null && !isNaN(val)) {
        const currentMonth = document.getElementById("filterMonth").value;
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "recordCheckMonth", rowIndex: rowIndex, monthTab: currentMonth, type: "THANH_TOAN", paymentVal: Number(val) })
        });
        showToast("Đã lưu số tiền thanh toán!");
        loadCustomerData();
      }
    }

    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => showToast(`Đã copy: ${text}`)); }
    function showToast(msg) {
      const c = document.getElementById("toast-container");
      const id = "toast_" + Date.now();
      c.insertAdjacentHTML('beforeend', `<div id="${id}" class="toast align-items-center text-white bg-success border-0 shadow show mb-2"><div class="d-flex"><div class="toast-body fw-bold">${msg}</div></div></div>`);
      setTimeout(() => document.getElementById(id)?.remove(), 2500);
    }
    function resetFilters() {
      document.getElementById("filterThanhToan").value = "chua_thanh_toan";
      document.getElementById("filterCheck").value = "ChuaCheck";
      document.getElementById("searchKeyword").value = "";
      filterData();
    }
  </script>
</body>
</html>
